  function openPunkteQuickEntry(cls, subj, cat, student, leistung){
    const existing = findSammelEntry(cls, cat, student.id, leistung);
    openUiModal((modal, close)=>{
      modal.appendChild(el("div",{class:"card-head"}, el("h3",{}, leistung.name+" — "+student.name)));
      const body = el("div",{class:"card-body"});
      const subskills = (cat.subskills && cat.subskills.length) ? cat.subskills : DEFAULT_SUBSKILLS;
      // Wenn die Leistung fixierte Maximalpunkte definiert (global bei der Leistungsauswahl
      // festgelegt), gilt dieser Wert für alle Schüler:innen und ist hier nicht mehr änderbar.
      const fixedMax = Array.isArray(leistung.maxPoints) && leistung.maxPoints.length===subskills.length ? leistung.maxPoints : null;
      const rowInputs = subskills.map((sk,i)=>{
        const prevPart = existing && existing.detail && existing.detail.parts && existing.detail.parts[i];
        const maxVal = fixedMax ? fixedMax[i] : (prevPart ? prevPart.max : sk.max);
        const pInput = el("input",{type:"number", value: prevPart? String(prevPart.points):"", min:"0", step:"0.5", placeholder:"Pkt", style:"width:72px;"});
        const mInput = el("input",{type:"number", value: String(maxVal), min:"0", step:"0.5", style:"width:64px;", disabled: fixedMax ? true : false, title: fixedMax ? "Maximalpunkte sind für diese Leistung fixiert (bei der Leistung bearbeitbar)" : ""});
        body.appendChild(el("label",{class:"field"}, sk.name,
          el("div",{style:"display:flex;gap:6px;align-items:center;"}, pInput, el("span",{style:"color:var(--ink-faint);font-size:12px;"},"/"), mInput)
        ));
        return {name:sk.name, pInput, mInput};
      });
      const suggestBadge = el("span",{class:"tag tag-none"},"–");
      const gradeSel = el("select",{}, [1,2,3,4,5].map(v=>el("option",{value:v}, v+" – "+GRADE_LABELS[v])));
      if(existing) gradeSel.value = String(existing.value);
      function recompute(){
        let sumP=0, sumM=0, any=false;
        rowInputs.forEach(r=>{
          const p = parseFloat((r.pInput.value||"").replace(",","."));
          const m = parseFloat((r.mInput.value||"").replace(",","."));
          if(!isNaN(p) && m>0){ sumP+=p; sumM+=m; any=true; }
        });
        if(any && sumM>0){
          const pct = (sumP/sumM)*100;
          const suggested = percentToMark(pct, effectiveLevel(subj));
          suggestBadge.className = "tag "+tagClassFor(suggested);
          suggestBadge.textContent = pct.toFixed(0)+"% → "+suggested;
          gradeSel.value = String(suggested);
        } else {
          suggestBadge.className = "tag tag-none";
          suggestBadge.textContent = "–";
        }
      }
      rowInputs.forEach(r=>{ r.pInput.addEventListener("input", recompute); r.mInput.addEventListener("input", recompute); });
      recompute();
      body.appendChild(el("label",{class:"field"},"Vorschlag", suggestBadge));
      body.appendChild(el("label",{class:"field"},"Note (bestätigen)", gradeSel));
      body.appendChild(el("div",{style:"font-size:12px;color:var(--ink-faint);"}, "Leistung: "+leistung.name+" · "+leistung.date));
      modal.appendChild(body);

      const foot = el("div",{class:"foot"});
      if(existing){
        foot.appendChild(el("button",{class:"btn btn-danger btn-sm", onclick:()=>{
          mutate(()=>{ state.grades = state.grades.filter(g=>g!==existing); });
          close();
        }}, "Löschen"));
      }
      foot.appendChild(el("button",{class:"btn btn-sm", onclick:close}, "Abbrechen"));
      foot.appendChild(el("button",{class:"btn btn-primary btn-sm", onclick:()=>{
        const parts = rowInputs.map(r=>({name:r.name, points:parseFloat((r.pInput.value||"0").replace(",","."))||0, max:parseFloat((r.mInput.value||"0").replace(",","."))||0}));
        const sumP = parts.reduce((a,p)=>a+p.points,0), sumM = parts.reduce((a,p)=>a+p.max,0);
        const detail = {parts, totalPoints:sumP, totalMax:sumM, percent: sumM>0?(sumP/sumM)*100:null};
        mutate(()=>{
          if(existing){
            existing.value = Number(gradeSel.value); existing.detail = detail;
          } else {
            state.grades.push({id:uid("g"), classId:cls.id, subjectId:subj.id, categoryId:cat.id, studentId:student.id, date:leistung.date, leistungId:leistung.id, note:leistung.name, value:Number(gradeSel.value), mult:1, detail});
          }
        });
        close();
      }}, "Speichern"));
      modal.appendChild(foot);
    });
  }

  // Modal zum Anlegen/Bearbeiten einer benannten Leistung (Name + Datum). Gibt ein Promise
  // zurück, das mit {name,date} (Speichern) oder null (Abbrechen) aufgelöst wird.
  function openLeistungModal(cls, subj, cat, existing){
    const subskills = (cat.subskills && cat.subskills.length) ? cat.subskills : DEFAULT_SUBSKILLS;
    const isPunkte = cat.type === "punkte";
    return new Promise((resolve)=>{
      openUiModal((modal, close)=>{
        modal.appendChild(el("div",{class:"card-head"}, el("h3",{}, existing ? "Leistung bearbeiten" : "Neue Leistung — "+cat.name)));
        const body = el("div",{class:"card-body"});
        const nameInput = el("input",{type:"text", value: existing?existing.name:"", placeholder:"z. B. „2. Test“, „Hausübung KW12“"});
        body.appendChild(el("label",{class:"field"},"Name", nameInput));
        const dateInput = el("input",{type:"date", value: existing?existing.date:new Date().toISOString().slice(0,10)});
        body.appendChild(el("label",{class:"field"},"Datum", dateInput));

        let maxInputs = null;
        if(isPunkte){
          const existingMax = Array.isArray(existing && existing.maxPoints) ? existing.maxPoints : null;
          const maxBox = el("div",{style:"flex:1 1 100%;margin-top:10px;padding:12px 14px;border:1px solid var(--accent);border-radius:var(--radius);background:var(--accent-tint);"});
          maxBox.appendChild(el("div",{style:"font-size:13px;font-weight:700;color:var(--accent-strong);margin-bottom:3px;"}, "Maximalpunkte je Teilbereich"));
          maxBox.appendChild(el("div",{style:"font-size:12px;color:var(--ink-muted);margin-bottom:10px;"},
            "Gilt für diese Leistung bei allen Schüler:innen und ist bei der Eingabe fixiert."));
          const maxFields = el("div",{style:"display:flex;gap:12px;flex-wrap:wrap;"});
          maxInputs = subskills.map((sk,i)=>{
            const mInput = el("input",{type:"number", value: String(existingMax ? existingMax[i] : sk.max), min:"0", step:"0.5", style:"width:80px;"});
            maxFields.appendChild(el("label",{class:"field", style:"flex:0 0 auto;min-width:120px;"}, sk.name+" (max)", mInput));
            return mInput;
          });
          maxBox.appendChild(maxFields);
          body.appendChild(maxBox);
        }
        modal.appendChild(body);

        const foot = el("div",{class:"foot"});
        foot.appendChild(el("button",{class:"btn btn-sm", onclick:()=>{ close(); resolve(null); }}, "Abbrechen"));
        foot.appendChild(el("button",{class:"btn btn-primary btn-sm", onclick:()=>{
          const name = (nameInput.value||"").trim();
          if(!name){ nameInput.focus(); return; }
          close();
          const result = {name, date: dateInput.value || new Date().toISOString().slice(0,10)};
          if(maxInputs) result.maxPoints = maxInputs.map(inp=>parseFloat((inp.value||"0").replace(",","."))||0);
          resolve(result);
        }}, "Speichern"));
        modal.appendChild(foot);
        setTimeout(()=>nameInput.focus(), 30);
      });
    });
  }

  /* ============================= EXPORT ============================= */
  function safeFileToken(s){
    return String(s||"").replace(/[\\\/:*?"<>|]/g,"").replace(/\s+/g,"_").slice(0,60);
  }

  function buildLeistungRows(cls, subj, cat, leistung){
    const subskills = (cat.subskills && cat.subskills.length) ? cat.subskills : DEFAULT_SUBSKILLS;
    const header = ["Leistung","Datum","Fach","Kategorie","Gewicht %","Schüler:in"];
    const colMeta = [{width:20},{width:12},{width:14},{width:14},{width:9,style:"num"},{width:22}];
    if(cat.type==="punkte"){
      subskills.forEach(sk=>{ header.push(sk.name+" (Punkte)", sk.name+" (Max)"); colMeta.push({width:14,style:"num"},{width:10,style:"num"}); });
      header.push("Punkte gesamt","Max gesamt","Prozent","Note");
      colMeta.push({width:12,style:"num"},{width:10,style:"num"},{width:9,style:"pct"},{width:8,style:"grade"});
    } else if(cat.type==="hausuebung" || cat.type==="mitarbeit"){
      header.push("Symbol","Zählt (nicht entschuldigt)","Note-Wert");
      colMeta.push({width:9},{width:20},{width:10,style:"grade"});
    } else {
      header.push("Note","Gewicht ×");
      colMeta.push({width:8,style:"grade"},{width:10,style:"num"});
    }
    const rows = [];
    const students = cls.students.slice().sort((a,b)=>a.name.localeCompare(b.name));
    students.forEach(s=>{
      const g = state.grades.find(x=>x.classId===cls.id && x.studentId===s.id && x.categoryId===cat.id && x.leistungId===leistung.id);
      const base = [leistung.name, leistung.date, subj.name, cat.name, cat.weight, s.name];
      let extra;
      if(cat.type==="punkte"){
        if(g && g.detail){
          extra = [];
          subskills.forEach((sk,i)=>{
            const part = g.detail.parts && g.detail.parts[i];
            extra.push(part ? part.points : "", part ? part.max : "");
          });
          extra.push(g.detail.totalPoints, g.detail.totalMax, g.detail.percent!=null ? Number(g.detail.percent.toFixed(1)) : "", g.value);
        } else {
          extra = subskills.reduce((a)=>a.concat(["",""]),[]).concat(["","","",""]);
        }
      } else if(cat.type==="hausuebung" || cat.type==="mitarbeit"){
        extra = g ? [g.symbol||"", g.excluded?"nein":"ja", g.value] : ["","",""];
      } else {
        extra = g ? [g.value, g.mult] : ["",""];
      }
      rows.push(base.concat(extra));
    });
    return {header, rows, colMeta};
  }

  function buildPeriodRows(cls, fromDate, toDate, subjFilter, catFilter){
    const header = ["Datum","Leistung","Fach","Kategorie","Gewicht %","Schüler:in","Bewertung","Note","Details"];
    const colMeta = [{width:12},{width:20},{width:14},{width:14},{width:9,style:"num"},{width:22},{width:12},{width:8,style:"grade"},{width:34}];
    const rows = [];
    const leistungen = state.leistungen.filter(l=>l.classId===cls.id
      && (!fromDate || l.date>=fromDate) && (!toDate || l.date<=toDate)
      && (subjFilter==="all" || l.subjectId===subjFilter)
      && (catFilter==="all" || l.categoryId===catFilter)
    ).sort((a,b)=>a.date.localeCompare(b.date) || a.name.localeCompare(b.name));
    leistungen.forEach(l=>{
      const subj = cls.subjects.find(s=>s.id===l.subjectId);
      const cat = subj ? subj.categories.find(c=>c.id===l.categoryId) : null;
      if(!subj || !cat) return;
      const students = cls.students.slice().sort((a,b)=>a.name.localeCompare(b.name));
      students.forEach(s=>{
        const g = state.grades.find(x=>x.leistungId===l.id && x.studentId===s.id);
        if(!g) return; // nur tatsächlich erfasste Bewertungen exportieren
        let bewertung, details;
        if(g.symbol){ bewertung = g.symbol; details = ""; }
        else if(g.detail){ bewertung = g.detail.percent!=null ? g.detail.percent.toFixed(1)+"%" : ""; details = (g.detail.parts||[]).map(p=>p.name+": "+p.points+"/"+p.max).join(" | "); }
        else { bewertung = "×"+g.mult; details = ""; }
        rows.push([l.date, l.name, subj.name, cat.name, cat.weight, s.name, bewertung, g.value, details]);
      });
    });
    return {header, rows, colMeta};
  }

    ));

    if(!cls.students.length || !cls.subjects.length){
      wrap.appendChild(el("div",{class:"card"}, el("div",{class:"empty-state"}, el("p",{},"Lege zuerst mindestens einen Schüler und ein Fach mit Kategorie an."))));

    subjSel.value = subjId;
    const catSel = el("select",{style:"min-width:200px;"});
    const leistungSel = el("select",{style:"min-width:220px;"});
    const exportXlsxBtn = el("button",{class:"btn btn-primary btn-sm", type:"button"}, icon("download"), "Als Excel exportieren");
    const exportPdfBtn = el("button",{class:"btn btn-sm", type:"button"}, icon("printer"), "Als PDF exportieren");

    function currentSubj(){ return cls.subjects.find(s=>s.id===subjSel.value); }
    function currentCat(){ const s = currentSubj(); return s ? s.categories.find(c=>c.id===catSel.value) : null; }

    function refreshLeistungOptions(){
      leistungSel.innerHTML = "";
      const s = currentSubj(), cat = currentCat();
      const opts = (s && cat) ? state.leistungen.filter(l=>l.classId===cls.id && l.subjectId===s.id && l.categoryId===cat.id).sort((a,b)=>b.date.localeCompare(a.date)) : [];
      if(!opts.length){
        leistungSel.appendChild(el("option",{value:""},"— keine Leistung vorhanden —"));
        exportXlsxBtn.disabled = true; exportPdfBtn.disabled = true;
      } else {
        opts.forEach(l=>leistungSel.appendChild(el("option",{value:l.id}, l.name+" ("+l.date+")")));
        exportXlsxBtn.disabled = false; exportPdfBtn.disabled = false;
      }
    }
    function refreshCatOptions(){
      catSel.innerHTML = "";
      const s = currentSubj();
      (s ? s.categories : []).forEach(c=>catSel.appendChild(el("option",{value:c.id}, c.name+" ("+c.weight+"%)")));
      const preferred = state.selectedCategoryByClass[cls.id];
      if(preferred && s && s.categories.some(c=>c.id===preferred)) catSel.value = preferred;
      refreshLeistungOptions();
    }
    subjSel.addEventListener("change", refreshCatOptions);
    catSel.addEventListener("change", refreshLeistungOptions);
    refreshCatOptions();

    function currentSingleExport(){
      const s = currentSubj(), cat = currentCat();
      const leistung = state.leistungen.find(l=>l.id===leistungSel.value);
      if(!s || !cat || !leistung) return null;
      return {s, cat, leistung, built: buildLeistungRows(cls, s, cat, leistung)};
    }

    exportXlsxBtn.addEventListener("click", async ()=>{
      const ctx = currentSingleExport();
      if(!ctx) return;
      const filenameBase = "leistung_"+safeFileToken(ctx.leistung.name)+"_"+ctx.leistung.date;
      exportXlsxBtn.disabled = true;
      try{
        const result = await exportRowsAsXlsx(filenameBase, ctx.leistung.name, ctx.built.header, ctx.built.rows, ctx.built.colMeta);
        if(result === "fallback-pdf") await exportRowsAsPdf(filenameBase, ctx.leistung.name, ctx.cat.name+" · "+cls.name+" · "+ctx.leistung.date, ctx.built.header, ctx.built.rows, ctx.built.colMeta);
      } finally { exportXlsxBtn.disabled = false; }
    });
    exportPdfBtn.addEventListener("click", async ()=>{
      const ctx = currentSingleExport();
      if(!ctx) return;
      const filenameBase = "leistung_"+safeFileToken(ctx.leistung.name)+"_"+ctx.leistung.date;
      exportPdfBtn.disabled = true;
      try{ await exportRowsAsPdf(filenameBase, ctx.leistung.name, ctx.cat.name+" · "+cls.name+" · "+ctx.leistung.date, ctx.built.header, ctx.built.rows, ctx.built.colMeta); }
      finally { exportPdfBtn.disabled = false; }
    });

    singleBody.appendChild(el("label",{class:"field"},"Fach", subjSel));
    singleBody.appendChild(el("label",{class:"field"},"Kategorie", catSel));
    singleBody.appendChild(el("label",{class:"field"},"Leistung", leistungSel));
    singleBody.appendChild(el("div",{style:"display:flex;gap:8px;"}, exportXlsxBtn, exportPdfBtn));
    singleCard.appendChild(singleBody);
    singleCard.appendChild(el("div",{style:"padding:0 18px 16px;color:var(--ink-muted);font-size:12.5px;"},
      "Enthält je Schüler:in alle Details der gewählten Leistung (z. B. Punkte je Teilbereich bei Tests, Symbol bei Hausübung/Mitarbeit)."));

    /* ---- Karte 2: Zeitraum, alle Schüler:innen ---- */
    const allDates = state.leistungen.filter(l=>l.classId===cls.id).map(l=>l.date).sort();

    const ep = state.exportPeriod;

    const defaultTo = ep.to || allDates[allDates.length-1] || new Date().toISOString().slice(0,10);

    const periodCard = el("div",{class:"card"});
    periodCard.appendChild(el("div",{class:"card-head"}, el("h3",{},"Zeitraum exportieren"), el("span",{class:"hint"},"Alle Leistungen aller Schüler:innen, im Detail")));
    const periodBody = el("div",{class:"card-body", style:"display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end;"});

    toInput.addEventListener("change", ()=>{ state.exportPeriod.to = toInput.value; });

    const pSubjSel = el("select",{style:"min-width:170px;"},
      el("option",{value:"all"},"Alle Fächer"),
      ...cls.subjects.map(s=>el("option",{value:s.id}, s.name))
    );
    const pCatSel = el("select",{style:"min-width:200px;"}, el("option",{value:"all"},"Alle Kategorien"));

    pSubjSel.addEventListener("change", refreshPeriodCats);
    refreshPeriodCats();

    const periodExportXlsxBtn = el("button",{class:"btn btn-primary btn-sm", type:"button"}, icon("download"), "Als Excel exportieren");
    const periodExportPdfBtn = el("button",{class:"btn btn-sm", type:"button"}, icon("printer"), "Als PDF exportieren");

    async function currentPeriodExport(){
      const from = fromInput.value, to = toInput.value;
      if(from && to && from > to){ await uiAlert("Der Beginn des Zeitraums liegt nach dem Ende — bitte Daten prüfen."); return null; }
      const built = buildPeriodRows(cls, from, to, pSubjSel.value, pCatSel.value);
      if(!built.rows.length){ await uiAlert("Für diesen Zeitraum (und Filter) wurden keine Bewertungen gefunden."); return null; }
      return {from, to, built};
    }

    periodExportXlsxBtn.addEventListener("click", async ()=>{
      const ctx = await currentPeriodExport();
      if(!ctx) return;
      const filenameBase = "leistungen_"+safeFileToken(cls.name)+"_"+(ctx.from||"anfang")+"_bis_"+(ctx.to||"ende");
      periodExportXlsxBtn.disabled = true;
      try{
        const result = await exportRowsAsXlsx(filenameBase, cls.name, ctx.built.header, ctx.built.rows, ctx.built.colMeta);
        if(result === "fallback-pdf") await exportRowsAsPdf(filenameBase, cls.name+" — Leistungsübersicht", "Zeitraum "+(ctx.from||"—")+" bis "+(ctx.to||"—"), ctx.built.header, ctx.built.rows, ctx.built.colMeta);
      } finally { periodExportXlsxBtn.disabled = false; }
    });
    periodExportPdfBtn.addEventListener("click", async ()=>{
      const ctx = await currentPeriodExport();
      if(!ctx) return;
      const filenameBase = "leistungen_"+safeFileToken(cls.name)+"_"+(ctx.from||"anfang")+"_bis_"+(ctx.to||"ende");
      periodExportPdfBtn.disabled = true;
      try{ await exportRowsAsPdf(filenameBase, cls.name+" — Leistungsübersicht", "Zeitraum "+(ctx.from||"—")+" bis "+(ctx.to||"—"), ctx.built.header, ctx.built.rows, ctx.built.colMeta); }
      finally { periodExportPdfBtn.disabled = false; }
    });

    periodBody.appendChild(el("label",{class:"field", style:"max-width:170px;"},"Von", fromInput));
    periodBody.appendChild(el("label",{class:"field", style:"max-width:170px;"},"Bis", toInput));
    periodBody.appendChild(el("label",{class:"field"},"Fach", pSubjSel));
    periodBody.appendChild(el("label",{class:"field"},"Kategorie", pCatSel));
    periodBody.appendChild(el("div",{style:"display:flex;gap:8px;"}, periodExportXlsxBtn, periodExportPdfBtn));
    periodCard.appendChild(periodBody);
    periodCard.appendChild(el("div",{style:"padding:0 18px 16px;color:var(--ink-muted);font-size:12.5px;"},
      "Eine Zeile je erfasster Bewertung im gewählten Zeitraum, mit Datum, Leistungsname, Fach, Kategorie, Schüler:in und Details."));
    wrap.appendChild(periodCard);

    return wrap;
  }

  /* ============================= DASHBOARD ============================= */
  function renderDashboard(cls){
    const wrap = el("div",{});
    wrap.appendChild(el("div",{class:"page-head"},
      el("div",{}, el("h2",{},cls.name+" — Klassendashboard"), el("div",{class:"desc"},"Aktueller Leistungsstand auf einen Blick."))
    ));

    const results = []; // {student, perSubject:{subjectId:{raw,rounded}}, overallRaw}
    cls.students.forEach(s=>{
      const perSubject = {};
      let sum=0,n=0;
      cls.subjects.forEach(subj=>{
        const r = subjectResult(cls.id, subj.id, s.id);
        perSubject[subj.id] = r;
        if(r.raw!=null){ sum+=r.raw; n++; }
      });
      results.push({student:s, perSubject, overallRaw: n? sum/n : null, overallRounded: n? roundGrade(sum/n): null});
    });

    const gradedCount = state.grades.filter(g=>g.classId===cls.id).length;
    const overallVals = results.map(r=>r.overallRaw).filter(v=>v!=null);
    const classAvg = overallVals.length ? (overallVals.reduce((a,b)=>a+b,0)/overallVals.length) : null;
    const riskStudents = results.filter(r=>r.overallRounded>=4);

    // stat tiles
    const stats = el("div",{class:"stat-grid"});
    stats.appendChild(statTile("Klassenschnitt", classAvg!=null? classAvg.toFixed(2).replace(".",","):"–", classAvg!=null?"Note "+roundGrade(classAvg)+" ("+GRADE_LABELS[roundGrade(classAvg)]+")":"Keine Daten", classAvg!=null && classAvg>=3.5?"warn":classAvg!=null&&classAvg<=2?"good":""));
    stats.appendChild(statTile("Schüler:innen", String(cls.students.length), cls.subjects.length+" Fächer"));
    stats.appendChild(statTile("Erfasste Noten", String(gradedCount), "in dieser Klasse"));
    stats.appendChild(statTile("Risiko (Note ≥ 4)", String(riskStudents.length), riskStudents.length?"benötigen Aufmerksamkeit":"aktuell unauffällig", riskStudents.length?"crit":"good"));
    wrap.appendChild(stats);

    // subject meters
    const subjCard = el("div",{class:"card"});
    subjCard.appendChild(el("div",{class:"card-head"}, el("h3",{},"Fächer im Überblick"), el("span",{class:"hint"},"Klassendurchschnitt je Fach (1 = Sehr gut, 5 = Nicht genügend)")));
    const subjBody = el("div",{class:"card-body"});
    if(!cls.subjects.length){
      subjBody.appendChild(el("div",{class:"empty-state"}, el("p",{},"Noch keine Fächer angelegt.")));
    } else {
      cls.subjects.forEach(subj=>{

        const count = gradesFor(cls.id, subj.id).length;
        const row = el("div",{class:"subject-row"});
        row.appendChild(el("div",{},
          el("div",{class:"sname"}, subj.name),
          el("div",{class:"scount"}, count+" Noten erfasst")
        ));
        const meter = el("div",{class:"meter"});
        const ticks = el("div",{class:"ticks"});
        for(let i=0;i<5;i++) ticks.appendChild(el("i",{}));
        meter.appendChild(ticks);
        if(avg!=null){
          const pct = ((avg-1)/4)*100;
          const fill = el("div",{class:"fill", style:"width:"+pct+"%;background:"+colorVarFor(rounded)+";"});
          meter.appendChild(fill);
          tooltip(meter, subj.name+": Ø "+avg.toFixed(2).replace(".",",")+" → Note "+rounded);
        }
        row.appendChild(meter);
        row.appendChild(el("div",{style:"text-align:right;"}, avg!=null? el("span",{class:"tag "+tagClassFor(rounded)}, avg.toFixed(2).replace(".",",")) : el("span",{class:"tag tag-none"},"–")));

    // distribution histogram

    tableCard.appendChild(el("div",{class:"card-head"}, el("h3",{},"Noten je Schüler:in")));
    const tableBody = el("div",{class:"card-body"});

        const tr = el("tr",{}, el("td",{}, r.student.name));
        cls.subjects.forEach(s=>{
          const cell = r.perSubject[s.id];
          if(cell.rounded==null){ tr.appendChild(el("td",{}, el("span",{class:"tag tag-none"},"–"))); }
          else {
            const tag = el("span",{class:"tag "+tagClassFor(cell.rounded)}, String(cell.rounded));

  function subjectAverageOverall(cls, studentId){
    let sum=0, n=0;
    cls.subjects.forEach(subj=>{
      const r = subjectResult(cls.id, subj.id, studentId);
      if(r.raw!=null){ sum+=r.raw; n++; }
    });
    return n ? {raw:sum/n, rounded:roundGrade(sum/n)} : {raw:null, rounded:null};
  }

          el("td",{}, cat.name),

      ));

        ));

  function buildSparkline(entries){
    const w = 320, h = 120, pad = 10;
    const n = entries.length;
    const x = i => pad + (i*(w-2*pad))/(n-1);
    const y = v => pad + ((v-1)/4)*(h-2*pad); // 1 (best) at top, 5 (worst) at bottom
    const pts = entries.map((g,i)=>[x(i), y(g.value)]);
    const pathD = pts.map((p,i)=> (i===0?"M":"L")+p[0].toFixed(1)+","+p[1].toFixed(1)).join(" ");
    const last = entries[entries.length-1];
    const svgNS = "http://www.w3.org/2000/svg";
    const svg = document.createElementNS(svgNS,"svg");
    svg.setAttribute("viewBox","0 0 "+w+" "+h);
    svg.setAttribute("width","100%");
    svg.setAttribute("height",h);
    svg.setAttribute("class","spark");
    svg.setAttribute("preserveAspectRatio","none");

    [1,2,3,4,5].forEach(g=>{
      const gl = document.createElementNS(svgNS,"line");
      gl.setAttribute("x1",pad); gl.setAttribute("x2",w-pad);
      gl.setAttribute("y1",y(g)); gl.setAttribute("y2",y(g));
      gl.setAttribute("stroke", g===3 ? "var(--line-strong)" : "var(--line)");
      gl.setAttribute("stroke-width","1");
      if(g!==1 && g!==5) gl.setAttribute("stroke-dasharray","2 3");
      svg.appendChild(gl);
    });

    const path = document.createElementNS(svgNS,"path");
    path.setAttribute("d", pathD);
    path.setAttribute("fill","none");
    path.setAttribute("stroke","var(--accent)");
    path.setAttribute("stroke-width","2");
    path.setAttribute("stroke-linecap","round");
    path.setAttribute("stroke-linejoin","round");
    svg.appendChild(path);

    pts.forEach((p,i)=>{
      const c = document.createElementNS(svgNS,"circle");
      c.setAttribute("cx",p[0]); c.setAttribute("cy",p[1]);
      const isLast = i===pts.length-1;
      c.setAttribute("r", isLast? 4.5 : 2.5);
      c.setAttribute("fill", isLast ? colorVarFor(roundGrade(entries[i].value)) : "var(--accent)");
      c.setAttribute("stroke","var(--surface)");
      c.setAttribute("stroke-width","1.5");
      svg.appendChild(c);
    });

    const axis = el("div",{class:"spark-axis", style:"height:"+h+"px;"});
    [1,2,3,4,5].forEach(g=>{
      axis.appendChild(el("span",{style:"top:"+y(g)+"px;"}, String(g)));
    });

    const chartWrap = el("div",{class:"spark-chart"});
    chartWrap.appendChild(svg);

    const row = el("div",{class:"spark-row"}, axis, chartWrap);
    tooltip(svg, "Letzte Note ("+last.date+"): "+last.value);
    return row;
  }

  function statTile(label, value, sub, mod){
    return el("div",{class:"stat-tile"+(mod?" "+mod:"")},
      el("div",{class:"label"}, label),
      el("div",{class:"value mono"}, value),
      el("div",{class:"sub"}, sub)
    );
  }

  /* ============================= BOOT ============================= */
  let reopenAfterPrint = [];
  window.addEventListener("beforeprint", ()=>{
    reopenAfterPrint = [];
    document.querySelectorAll("details.verlauf-details").forEach(d=>{
      if(!d.open){ reopenAfterPrint.push(d); d.open = true; }
    });
  });
  window.addEventListener("afterprint", ()=>{
    reopenAfterPrint.forEach(d=>{ d.open = false; });
    reopenAfterPrint = [];
  });

  let booted = false;
  async function boot(){
    if(booted) return; // onAuthStateChanged kann mehrfach feuern (z. B. Token-Refresh)
    booted = true;
    state = await loadState();
    if(!state.classes.length){ /* keep as-is, empty state UI handles it */ }
    if(ensureLeistungen(state)) writeLocalBackup(state);
    render();
    setSaveDot(fbReady ? "" : "local");
  }

  window.__notenbuchBoot = boot;
  window.__notenbuchOnLogout = function(){
    booted = false;
    state = null;
    fbReady = false;
  };
})();
</script>
</body>
</html>
