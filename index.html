<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notenbuch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root{
    --bg:#f1efe8;
    --surface:#ffffff;
    --surface-2:#f7f5ef;
    --ink:#1e2a2e;
    --ink-muted:#5c6b6a;
    --ink-faint:#8b9694;
    --line:#dedad0;
    --line-strong:#c7c1b2;
    --accent:#2f5d5e;
    --accent-strong:#1c4142;
    --accent-tint:#e2ece9;
    --good-1:#0ca30c;
    --good-2:#6b9c1f;
    --neutral-3:#c98e00;
    --warn-4:#d9663a;
    --crit-5:#d03b3b;
    --shadow: 0 1px 2px rgba(30,42,46,.06), 0 6px 20px -8px rgba(30,42,46,.12);
    --radius: 10px;
    --font-display: "Fraunces", Georgia, "Times New Roman", serif;
    --font-body: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --font-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  }

  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#11181a;
      --surface:#182224;
      --surface-2:#1d292b;
      --ink:#eef2ee;
      --ink-muted:#a3b2ae;
      --ink-faint:#728280;
      --line:#2a3638;
      --line-strong:#3a4749;
      --accent:#6fb3ac;
      --accent-strong:#8fc9c2;
      --accent-tint:#1e3634;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px -10px rgba(0,0,0,.5);
    }
  }
  :root[data-theme="dark"]{
    --bg:#11181a;
    --surface:#182224;
    --surface-2:#1d292b;
    --ink:#eef2ee;
    --ink-muted:#a3b2ae;
    --ink-faint:#728280;
    --line:#2a3638;
    --line-strong:#3a4749;
    --accent:#6fb3ac;
    --accent-strong:#8fc9c2;
    --accent-tint:#1e3634;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px -10px rgba(0,0,0,.5);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:var(--font-body);
    font-size:15px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{background:var(--accent-tint);color:var(--accent-strong);}
  h1,h2,h3{font-family:var(--font-display);font-weight:600;letter-spacing:-0.01em;text-wrap:balance;margin:0;}
  .mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums;}
  button{font-family:inherit;}
  a{color:var(--accent-strong);}

  #app{display:flex;min-height:100vh;}

  /* ---------- Sidebar ---------- */
  .sidebar{
    width:260px;flex:none;
    background:var(--surface);
    border-right:1px solid var(--line);
    display:flex;flex-direction:column;
    padding:20px 16px;
    gap:22px;
    position:sticky;top:0;height:100vh;overflow-y:auto;
    transition:width .15s ease, padding .15s ease;
  }
  .sidebar.collapsed{
    width:72px;
    padding:20px 12px;
    overflow-x:hidden;
  }
  .brand-row{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;}
  .sidebar.collapsed .brand-row{flex-direction:column;align-items:center;gap:8px;}
  .brand{display:flex;align-items:baseline;gap:8px;padding:2px 4px 4px;min-width:0;}
  .brand .mark{
    width:30px;height:30px;border-radius:7px;
    background:linear-gradient(155deg,var(--accent),var(--accent-strong));
    display:flex;align-items:center;justify-content:center;
    color:#fff;font-family:var(--font-display);font-weight:700;font-size:15px;
    flex:none;
  }
  .brand h1{font-size:19px;}
  .brand .sub{font-size:11px;color:var(--ink-faint);letter-spacing:.04em;text-transform:uppercase;margin-top:1px;}

  .sidebar-toggle{
    display:flex;align-items:center;justify-content:center;
    width:26px;height:26px;padding:0;flex:none;border-radius:6px;border:1px solid var(--line);
    background:var(--surface-2);color:var(--ink-muted);cursor:pointer;margin-top:2px;
  }
  .sidebar-toggle:hover{border-color:var(--accent);color:var(--accent-strong);}
  .sidebar-toggle svg{width:13px;height:13px;flex:none;transition:transform .15s;transform:rotate(90deg);}
  .sidebar.collapsed .sidebar-toggle svg{transform:rotate(-90deg);}

  .side-section{display:flex;flex-direction:column;gap:6px;}
  .side-label{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-faint);padding:0 8px;margin-bottom:2px;}

  .nav-group-toggle .nav-label{flex:1;}
  .nav-group-toggle .chev{flex:none;width:14px;height:14px;color:var(--ink-faint);transition:transform .15s;}
  .nav-group-toggle .chev.open{transform:rotate(180deg);}
  .sidebar.collapsed .nav-group-toggle .chev{display:none;}

  .nav-tab{
    display:flex;align-items:center;gap:9px;
    padding:9px 10px;border-radius:8px;
    color:var(--ink-muted);font-size:14px;font-weight:500;
    cursor:pointer;border:1px solid transparent;background:none;text-align:left;width:100%;
  }
  .nav-tab:hover{background:var(--surface-2);}
  .nav-tab.active{background:var(--accent-tint);color:var(--accent-strong);font-weight:600;}
  .nav-tab svg{flex:none;width:16px;height:16px;}
  .nav-subtab{padding-left:28px;font-size:13px;}
  .sidebar.collapsed .nav-tab{justify-content:center;padding:9px;}
  .sidebar.collapsed .btn-ghost-add{justify-content:center;}
  .sidebar.collapsed .save-row{justify-content:center;}
  .sidebar.collapsed .save-dot{margin-right:0;}
  .sidebar.collapsed .nav-label,
  .sidebar.collapsed .side-label,
  .sidebar.collapsed .brand h1,
  .sidebar.collapsed .brand .sub,
  .sidebar.collapsed .sidebar-foot .foot-text{
    display:none;
  }

  .class-list{display:flex;flex-direction:column;gap:3px;max-height:260px;overflow-y:auto;}
  .class-item{
    display:flex;align-items:center;justify-content:space-between;gap:6px;
    padding:8px 10px;border-radius:8px;cursor:pointer;
    color:var(--ink-muted);font-size:13.5px;border:1px solid transparent;
  }
  .class-item:hover{background:var(--surface-2);}
  .class-item.active{background:var(--surface-2);border-color:var(--line-strong);color:var(--ink);font-weight:600;}
  .class-item .count{font-family:var(--font-mono);font-size:11px;color:var(--ink-faint);}

  .btn-ghost-add{
    display:flex;align-items:center;gap:6px;
    padding:8px 10px;border-radius:8px;border:1px dashed var(--line-strong);
    color:var(--ink-muted);font-size:13px;background:none;cursor:pointer;
  }
  .btn-ghost-add:hover{border-color:var(--accent);color:var(--accent-strong);}
  .btn-ghost-add svg{width:14px;height:14px;flex:none;}

  .sidebar-foot{margin-top:auto;padding-top:10px;border-top:1px solid var(--line);font-size:11.5px;color:var(--ink-faint);display:flex;flex-direction:column;gap:4px;}
  .save-dot{width:7px;height:7px;border-radius:50%;background:var(--good-2);display:inline-block;margin-right:6px;flex:none;transition:background .2s;}
  .save-row{display:flex;align-items:center;}
  .save-dot.saving{background:var(--neutral-3);}
  .save-dot.error{background:var(--crit-5);}
  .save-dot.local{background:var(--warn-4);}
  .notice-banner{
    display:flex;align-items:flex-start;gap:10px;
    background:color-mix(in srgb, var(--warn-4) 12%, var(--surface));
    border:1px solid color-mix(in srgb, var(--warn-4) 35%, transparent);
    color:var(--ink);
    border-radius:var(--radius);
    padding:12px 14px;font-size:13px;line-height:1.5;margin-bottom:16px;
  }
  .notice-banner svg{width:17px;height:17px;flex:none;margin-top:1px;color:var(--warn-4);}
  .notice-banner strong{color:var(--warn-4);}

  /* ---------- Main ---------- */
  main{flex:1;min-width:0;padding:28px 36px 60px;max-width:1180px;transition:max-width .15s ease;}
  #app.sidebar-collapsed main{max-width:1400px;}
  .page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap;}
  .page-head h2{font-size:26px;}
  .page-head .desc{color:var(--ink-muted);font-size:13.5px;margin-top:5px;max-width:52ch;}
  .head-actions{display:flex;gap:8px;flex:none;}

  .btn{
    display:inline-flex;align-items:center;gap:6px;
    padding:8px 14px;border-radius:8px;border:1px solid var(--line-strong);
    background:var(--surface);color:var(--ink);font-size:13.5px;font-weight:500;
    cursor:pointer;
  }
  .btn:hover{border-color:var(--accent);color:var(--accent-strong);}
  .btn-primary{background:var(--accent);border-color:var(--accent);color:#fff;}
  .btn-primary:hover{background:var(--accent-strong);border-color:var(--accent-strong);color:#fff;}
  .btn-danger{color:var(--crit-5);border-color:var(--line-strong);}
  .btn-danger:hover{border-color:var(--crit-5);background:transparent;}
  .btn-sm{padding:5px 10px;font-size:12.5px;border-radius:7px;}
  .btn:disabled{opacity:.45;cursor:not-allowed;}

  .card{
    background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--shadow);
  }
  .card + .card{margin-top:18px;}
  .card-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--line);gap:10px;flex-wrap:wrap;}
  .card-head h3{font-size:15.5px;}
  .card-head .hint{font-size:12px;color:var(--ink-faint);font-family:var(--font-body);font-weight:400;}
  .card-body{padding:18px;}
  summary.card-head{cursor:pointer;list-style:none;user-select:none;}
  details.collapsible-card:not([open]) > summary.card-head{border-bottom:none;}
  summary.card-head::-webkit-details-marker{display:none;}
  summary.card-head::marker{content:"";}
  summary.card-head .chev{display:flex;width:16px;height:16px;color:var(--ink-faint);transition:transform .15s;flex:none;}

  .subject-weight-block.with-border{margin-top:16px;padding-top:16px;border-top:1px solid var(--line);}
  .subject-weight-summary{
    display:flex;align-items:center;justify-content:space-between;gap:8px;
    cursor:pointer;list-style:none;user-select:none;padding:2px 0;
  }
  .subject-weight-summary::-webkit-details-marker{display:none;}
  .subject-weight-summary::marker{content:"";}
  .subject-weight-summary strong{font-size:14px;}
  .subject-weight-summary:hover strong{color:var(--accent-strong);}
  .subject-weight-summary .chev{display:flex;width:15px;height:15px;color:var(--ink-faint);transition:transform .15s;flex:none;}
  .subject-weight-summary .chev svg{width:100%;height:100%;}
  .subject-weight-block[open] > .subject-weight-summary .chev{transform:rotate(180deg);}
  .subject-weight-body{margin-top:12px;}
  summary.card-head .chev svg{width:100%;height:100%;}
  details.collapsible-card[open] > summary.card-head .chev{transform:rotate(180deg);}
  details.collapsible-card > summary.card-head:hover{color:var(--accent-strong);}

  .empty-state{padding:40px 20px;text-align:center;color:var(--ink-muted);}
  .empty-state .big{font-family:var(--font-display);font-size:19px;color:var(--ink);margin-bottom:6px;}
  .empty-state p{font-size:13.5px;max-width:40ch;margin:0 auto 16px;}

  /* forms */
  label.field{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--ink-muted);font-weight:500;}
  input[type=text],input[type=number],input[type=date],select,textarea{
    font-family:var(--font-body);font-size:13.5px;color:var(--ink);
    background:var(--surface-2);border:1px solid var(--line-strong);border-radius:7px;
    padding:8px 10px;outline:none;
  }
  input:focus,select:focus,textarea:focus,button:focus-visible,.nav-tab:focus-visible,.class-item:focus-visible{
    border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-tint);
  }
  .form-row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;}
  .form-row .field{flex:1 1 130px;min-width:110px;}

  table{border-collapse:collapse;width:100%;font-size:13.5px;}
  th{
    text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;
    color:var(--ink-faint);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line-strong);
    white-space:nowrap;
  }
  td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle;}
  tr:last-child td{border-bottom:none;}
  .table-wrap{overflow-x:auto;}
  .row-actions{display:flex;gap:5px;justify-content:flex-end;}
  .icon-btn{
    width:26px;height:26px;border-radius:6px;border:1px solid transparent;background:none;
    display:flex;align-items:center;justify-content:center;color:var(--ink-faint);cursor:pointer;
  }
  .icon-btn:hover{background:var(--surface-2);color:var(--crit-5);border-color:var(--line);}
  .icon-btn svg{width:14px;height:14px;}

  .tag{
    display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:20px;
    font-size:12px;font-weight:600;font-family:var(--font-mono);
  }
  .tag-1{background:color-mix(in srgb, var(--good-1) 16%, transparent);color:var(--good-1);}
  .tag-2{background:color-mix(in srgb, var(--good-2) 16%, transparent);color:var(--good-2);}
  .tag-3{background:color-mix(in srgb, var(--neutral-3) 18%, transparent);color:var(--neutral-3);}
  .tag-4{background:color-mix(in srgb, var(--warn-4) 18%, transparent);color:var(--warn-4);}
  .tag-5{background:color-mix(in srgb, var(--crit-5) 18%, transparent);color:var(--crit-5);}
  .tag-none{background:var(--surface-2);color:var(--ink-faint);}

  .sammel-table{min-width:100%;}
  .sammel-table th, .sammel-table td{white-space:nowrap;}
  .sammel-name{font-weight:600;position:sticky;left:0;background:var(--surface);}
  .quick-syms{display:flex;gap:4px;flex-wrap:nowrap;}
  .qsym, .qgrade{
    width:26px;height:26px;border-radius:7px;border:1px solid var(--line-strong);background:var(--surface);
    color:var(--ink-muted);font-size:12.5px;font-family:var(--font-mono);cursor:pointer;
    display:flex;align-items:center;justify-content:center;flex:none;transition:transform .1s, background .15s, color .15s, border-color .15s;
  }
  .qsym:hover, .qgrade:hover{border-color:var(--accent);color:var(--accent-strong);transform:translateY(-1px);}
  .qsym.excluded{color:var(--ink-faint);font-style:italic;}
  .qsym.active{background:var(--accent);border-color:var(--accent);color:#fff;}
  .qgrade.tag-1.active{background:var(--good-1);border-color:var(--good-1);color:#fff;}
  .qgrade.tag-2.active{background:var(--good-2);border-color:var(--good-2);color:#fff;}
  .qgrade.tag-3.active{background:var(--neutral-3);border-color:var(--neutral-3);color:#fff;}
  .qgrade.tag-4.active{background:var(--warn-4);border-color:var(--warn-4);color:#fff;}
  .qgrade.tag-5.active{background:var(--crit-5);border-color:var(--crit-5);color:#fff;}

  .tabs-sub{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px;}
  .tabs-sub button{
    background:none;border:none;padding:10px 4px;margin-right:18px;font-size:14px;font-weight:500;
    color:var(--ink-muted);cursor:pointer;border-bottom:2px solid transparent;position:relative;top:1px;
  }
  .tabs-sub button.active{color:var(--accent-strong);border-bottom-color:var(--accent);font-weight:600;}

  /* dashboard */
  .stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:18px;}
  .stat-tile{
    background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    padding:16px 16px;box-shadow:var(--shadow);
  }
  .stat-tile .label{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-faint);font-weight:600;}
  .stat-tile .value{font-family:var(--font-display);font-size:30px;margin-top:6px;line-height:1;}
  .stat-tile .sub{font-size:12px;color:var(--ink-muted);margin-top:6px;}
  .stat-tile.warn .value{color:var(--warn-4);}
  .stat-tile.crit .value{color:var(--crit-5);}
  .stat-tile.good .value{color:var(--good-1);}

  .subject-row{display:grid;grid-template-columns:150px 1fr 90px;gap:16px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);}
  .subject-row:last-child{border-bottom:none;}
  .subject-row .sname{font-weight:600;font-size:13.5px;}
  .subject-row .scount{font-size:11.5px;color:var(--ink-faint);margin-top:2px;}
  .meter{position:relative;height:10px;border-radius:6px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden;}
  .meter .fill{position:absolute;top:0;left:0;bottom:0;border-radius:6px;transition:width .3s;}
  .meter .ticks{position:absolute;inset:0;display:flex;}
  .meter .ticks i{flex:1;border-right:1px solid rgba(0,0,0,.06);}
  .meter .ticks i:last-child{border-right:none;}

  .hist{display:flex;align-items:flex-end;gap:8px;height:110px;padding-top:8px;}
  .hist .bar-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:6px;}
  .hist .bar{width:100%;max-width:46px;border-radius:4px 4px 2px 2px;min-height:2px;position:relative;}
  .hist .bar-label{font-size:11px;color:var(--ink-faint);font-family:var(--font-mono);}
  .hist .bar-count{font-size:11.5px;font-family:var(--font-mono);font-weight:600;color:var(--ink-muted);}

  .spark{display:block;}
  .spark-row{display:flex;align-items:flex-start;gap:8px;}
  .spark-axis{position:relative;width:14px;flex:none;font-size:10px;font-family:var(--font-mono);color:var(--ink-faint);}
  .spark-axis span{position:absolute;right:0;line-height:1;transform:translateY(-50%);}
  .spark-chart{flex:1;min-width:0;}

  .chip-row{display:flex;flex-wrap:wrap;gap:8px;}
  .risk-chip{
    display:flex;align-items:center;gap:8px;padding:7px 11px;border-radius:9px;
    background:var(--surface-2);border:1px solid var(--line);font-size:13px;
  }
  .risk-chip .name{font-weight:600;}
  .risk-chip .why{color:var(--ink-faint);font-size:11.5px;}

  .tooltip{
    position:fixed;pointer-events:none;background:var(--ink);color:var(--bg);
    font-size:12px;padding:6px 9px;border-radius:6px;z-index:50;
    box-shadow:var(--shadow);max-width:220px;line-height:1.4;font-family:var(--font-body);
    transform:translate(-50%,-100%);margin-top:-10px;opacity:0;transition:opacity .1s;
  }
  .tooltip.show{opacity:1;}

  .weight-warn{
    display:flex;align-items:center;gap:6px;font-size:12px;color:var(--warn-4);margin-top:8px;
  }

  .modal-backdrop{
    position:fixed;inset:0;background:rgba(15,20,20,.45);display:flex;align-items:center;justify-content:center;
    z-index:100;padding:20px;
  }
  .modal{
    background:var(--surface);border-radius:12px;max-width:420px;width:100%;
    box-shadow:0 20px 60px -12px rgba(0,0,0,.4);border:1px solid var(--line);
  }
  .modal .card-head h3{font-size:16px;}
  .modal .card-body{display:flex;flex-direction:column;gap:12px;}
  .modal .foot{display:flex;justify-content:flex-end;gap:8px;padding:14px 18px;border-top:1px solid var(--line);}

  .legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--ink-muted);margin-top:10px;}
  .legend .sw{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:5px;position:relative;top:1px;}

  .verlauf-details{border-top:1px solid var(--line);padding-top:12px;}
  .verlauf-summary{
    display:flex;align-items:center;justify-content:space-between;gap:8px;
    cursor:pointer;list-style:none;font-size:12.5px;font-weight:600;color:var(--ink-muted);
    padding:2px 0;user-select:none;
  }
  .verlauf-summary::-webkit-details-marker{display:none;}
  .verlauf-summary:hover{color:var(--accent-strong);}
  .verlauf-summary .chev{display:flex;width:15px;height:15px;color:var(--ink-faint);transition:transform .15s;}
  .verlauf-summary .chev svg{width:100%;height:100%;}
  details[open] > .verlauf-summary .chev{transform:rotate(180deg);}
  .verlauf-body{display:flex;flex-direction:column;gap:2px;margin-top:6px;}
  .verlauf-item + .verlauf-item{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);}

  @media (max-width: 860px){
    #app{flex-direction:column;}
    .sidebar{width:100%;height:auto;position:relative;border-right:none;border-bottom:1px solid var(--line);}
    main{padding:22px 16px 50px;}
    .subject-row{grid-template-columns:110px 1fr 70px;gap:10px;}
  }

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import {
    getFirestore, doc, getDoc, setDoc, deleteDoc, collection, getDocs
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
  import {
    getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCEnBLvlBfb1EVtLU1PPRn_mDaon2yOYAw",
    authDomain: "leistungserfassung-nms-andorf.firebaseapp.com",
    projectId: "leistungserfassung-nms-andorf",
    storageBucket: "leistungserfassung-nms-andorf.firebasestorage.app",
    messagingSenderId: "973144844414",
    appId: "1:973144844414:web:a6c1600408f2848dcf102f"
  };

  const firebaseApp = initializeApp(firebaseConfig);
  const firestoreDb = getFirestore(firebaseApp);
  const firebaseAuthInst = getAuth(firebaseApp);

  window.__firebase = {
    doc, getDoc, setDoc, deleteDoc, collection, getDocs,
    db: firestoreDb, auth: firebaseAuthInst
  };

  const loginGate = document.getElementById("login-gate");
  const appRoot = document.getElementById("app-root");
  const loginForm = document.getElementById("login-form");
  const loginUser = document.getElementById("login-user");
  const loginPass = document.getElementById("login-pass");
  const loginError = document.getElementById("login-error");
  const loginSubmit = document.getElementById("login-submit");

  function showLoginError(msg){
    loginError.textContent = msg;
    loginError.classList.add("show");
  }
  function hideLoginError(){
    loginError.classList.remove("show");
    loginError.textContent = "";
  }
  function usernameToEmail(username){
    const clean = String(username || "").trim().toLowerCase();
    return clean + "@" + firebaseConfig.authDomain;
  }
  function authErrorMessage(err){
    const code = err && err.code;
    let msg;
    if(code === "auth/invalid-credential" || code === "auth/wrong-password" || code === "auth/user-not-found"){
      msg = "Benutzername oder Passwort ist falsch.";
    }else if(code === "auth/too-many-requests"){
      msg = "Zu viele fehlgeschlagene Versuche. Bitte kurz warten und erneut versuchen.";
    }else if(code === "auth/network-request-failed"){
      msg = "Keine Verbindung zum Anmeldeserver möglich. Bitte Internetverbindung prüfen.";
    }else if(code === "auth/configuration-not-found" || code === "auth/operation-not-allowed"){
      msg = "Die Anmeldung ist in Firebase noch nicht aktiviert (E-Mail/Passwort-Anmeldung fehlt in der Firebase-Konsole).";
    }else if(code === "auth/unauthorized-domain"){
      msg = "Diese Webadresse ist in Firebase noch nicht als autorisierte Domain freigegeben.";
    }else if(code === "auth/timeout-lokal"){
      msg = "Zeitüberschreitung: Der Anmeldeserver antwortet nicht. Bitte Internetverbindung, Firewall oder Werbeblocker prüfen und erneut versuchen.";
    }else{
      msg = "Anmeldung fehlgeschlagen. Bitte erneut versuchen.";
    }
    const detail = code ? ("Code: " + code) : ((err && (err.message || err.name)) ? String(err.message || err.name) : "kein Fehlercode erhalten");
    return msg + "  (" + detail + ")";
  }

  function withTimeout(promise, ms){
    return Promise.race([
      promise,
      new Promise((_, reject) => setTimeout(() => reject({code:"auth/timeout-lokal"}), ms))
    ]);
  }

  loginForm.addEventListener("submit", async function(e){
    e.preventDefault();
    hideLoginError();
    loginSubmit.disabled = true;
    loginSubmit.textContent = "Anmelden…";
    try{
      await withTimeout(
        signInWithEmailAndPassword(firebaseAuthInst, usernameToEmail(loginUser.value), loginPass.value),
        15000
      );
    }catch(err){
      console.error("Notenbuch-Anmeldefehler:", err);
      showLoginError(authErrorMessage(err));
      loginSubmit.disabled = false;
      loginSubmit.textContent = "Anmelden";
    }
  });

  window.__notenbuchLogout = function(){
    signOut(firebaseAuthInst);
  };

  onAuthStateChanged(firebaseAuthInst, function(user){
    if(user){
      loginGate.hidden = true;
      appRoot.hidden = false;
      loginSubmit.disabled = false;
      loginSubmit.textContent = "Anmelden";
      loginPass.value = "";
      if(typeof window.__notenbuchBoot === "function"){
        window.__notenbuchBoot();
      }
    }else{
      appRoot.hidden = true;
      loginGate.hidden = false;
      if(typeof window.__notenbuchOnLogout === "function"){
        window.__notenbuchOnLogout();
      }
    }
  });
</script>

<script>
  // Wächter: Falls das Firebase-Modul (z. B. wegen Werbeblocker, Firewall oder fehlender
  // Internetverbindung) gar nicht laden konnte, bleibt die Anmeldemaske sonst stumm hängen.
  // Nach kurzer Wartezeit wird dann ein erklärender Hinweis eingeblendet.
  setTimeout(function(){

        errBox.classList.add("show");
      }
    }
  }, 6000);
</script>

  function buildImportedClass(){
    const catDefs = [
      {name:"Tests", weight:35, type:"punkte", subskills:DEFAULT_SUBSKILLS.map(s=>({...s}))},
      {name:"Revisions", weight:15, type:"punkte", subskills:[{name:"Gesamt", max:35}]},
      {name:"Hausübung", weight:20, type:"hausuebung"},
      {name:"Mitarbeit", weight:30, type:"mitarbeit"},
    ];
    const catIds = {};
    const categories = catDefs.map(c=>{
      const id = uid("cat");
      catIds[c.name] = id;
      return {id, name:c.name, weight:c.weight, type:c.type, subskills:c.subskills};
    });
    const subjectId = uid("sub");
    const classId = uid("cls");

    const studentIds = {};
    const students = IMPORTED_ENGLISCH_DATA.students.map(s=>{
      const id = uid("stu");
      studentIds[s.key] = id;
      return {id, name:s.name};
    });

    const grades = IMPORTED_ENGLISCH_DATA.grades.map(g=>{
      const studentId = studentIds[g.studentKey];
      const categoryId = catIds[g.category];
      if(!studentId || !categoryId) return null;
      return {
        id: uid("g"), classId, subjectId, categoryId, studentId,
        value: g.value, mult: g.mult||1, date: g.date, note: g.note||"",
        symbol: g.symbol||undefined, excluded: !!g.excluded,
        detail: g.detail||undefined,
      };
    }).filter(Boolean);

    return {
      id: classId, name: "1c", importKey: "1c_englisch_import",
      students,
      subjects: [
        {id: subjectId, name: "Englisch", performanceLevelId: "standard_ahs", categories}
      ],
      _grades: grades,
    };
  }

  function seedState(){
    const built = buildImportedClass();
    const grades = built._grades;
    delete built._grades;
    return {
      version:1,
      settings:{ rounding:"down" },
      subjectTemplates: defaultSubjectTemplates(),
      performanceLevels: defaultPerformanceLevels(),
      selectedClassId: built.id,
      selectedStudentByClass:{ [built.id]: built.students[0] ? built.students[0].id : null },
      selectedSubjectByClass:{},
      selectedCategoryByClass:{},
      selectedLeistungByCategory:{},
      sammelDate: new Date().toISOString().slice(0,10),
      activeTab:"eingabe",
      classes:[ built ],
      grades,
      leistungen: []
    };

  let downloadsApi = null; // in dieser Web-Version nie verfügbar -> downloadFile() nutzt immer den Blob-Fallback
  let saveTimer = null;
  let dirty = false;
  let fbReady = false;
  let fbDocRef = null;

  // Ein-/Ausklapp-Status der Bereiche in "Klassenkonfiguration" und "Leistungseingabe" —
  // rein visuell, wird nicht gespeichert/synchronisiert. Standardmäßig eingeklappt (true = eingeklappt).
  let sectionCollapse = { students:true, subjects:true, weights:true, gradeList:true, einzelnote:true, mehrfachnoten:true };

  // Ein-/Ausklapp-Status der einzelnen Fach-Boxen in "Notengewichtung" (je Fach-id) — rein
  // visuell, wird nicht gespeichert. Standardmäßig eingeklappt (fehlender Eintrag = eingeklappt).
  let subjectWeightsOpen = {};

  // Ein-/Ausklapp-Status des linken Menüs (Seitenleiste) — rein visuell, wird nicht gespeichert.
  let sidebarCollapsed = false;

  // Ein-/Ausklapp-Status von Untermenü-Gruppen in der Seitenleiste (z. B. "Dashboards") —
  // rein visuell, wird nicht gespeichert. Standardmäßig eingeklappt (true = eingeklappt).
  let navGroupCollapse = { dashboards:true };

  const LOCAL_BACKUP_KEY = "notenbuch_v1_backup";

  function defaultState(){
    return { version:1, settings:{rounding:"down"}, subjectTemplates:defaultSubjectTemplates(), performanceLevels:defaultPerformanceLevels(), selectedClassId:null, selectedStudentByClass:{}, selectedSubjectByClass:{}, selectedCategoryByClass:{}, selectedLeistungByCategory:{}, sammelDate:new Date().toISOString().slice(0,10), activeTab:"eingabe", classes:[], grades:[], leistungen:[] };
  }

  // Stellt sicher, dass jede erfasste Note einer benannten "Leistung" zugeordnet ist
  // (z. B. "2. Test", "Hausübung KW12"), damit Bewertungen später eindeutig identifizierbar
  // sind. Bestehende Einträge ohne leistungId werden anhand von Fach/Kategorie/Datum/Notiz
  // gruppiert und einer (neuen oder bereits erzeugten) Leistung zugeordnet — nicht destruktiv.
  function ensureLeistungen(state){
    let templatesChanged = ensureSubjectTemplates(state);
    templatesChanged = ensurePerformanceLevels(state) || templatesChanged;
    if(!Array.isArray(state.leistungen)) state.leistungen = [];
    if(!state.selectedCategoryByClass) state.selectedCategoryByClass = {};
    if(!state.selectedLeistungByCategory) state.selectedLeistungByCategory = {};
    const byKey = new Map();
    state.leistungen.forEach(l=>byKey.set([l.classId,l.subjectId,l.categoryId,l.date,l.name].join("|"), l));
    let changed = false;
    (state.grades||[]).forEach(g=>{
      if(g.leistungId && state.leistungen.some(l=>l.id===g.leistungId)) return;
      const cls = state.classes.find(c=>c.id===g.classId);
      const subj = cls && cls.subjects.find(s=>s.id===g.subjectId);
      const cat = subj && subj.categories.find(c=>c.id===g.categoryId);
      const name = (g.note && g.note.trim()) ? g.note.trim() : (cat ? cat.name : "Leistung") + " " + g.date;
      const key = [g.classId, g.subjectId, g.categoryId, g.date, name].join("|");
      let l = byKey.get(key);
      if(!l){
        l = {id:uid("lst"), classId:g.classId, subjectId:g.subjectId, categoryId:g.categoryId, name, date:g.date};
        state.leistungen.push(l);
        byKey.set(key, l);
      }
      g.leistungId = l.id;
      changed = true;
    });
    return changed || templatesChanged;
  }

  function readLocalBackup(){
    try{
      const raw = localStorage.getItem(LOCAL_BACKUP_KEY);
      if(!raw) return null;
      const json = JSON.parse(raw);
      if(json && Array.isArray(json.classes)) return json;
    }catch(e){ /* storage unavailable or corrupt — ignore */ }
    return null;
  }

  function writeLocalBackup(s){
    try{ localStorage.setItem(LOCAL_BACKUP_KEY, JSON.stringify(s)); return true; }
    catch(e){ return false; }
  }

  /* ============================= FIREBASE-SPEICHERUNG =============================
     Der komplette Anwendungszustand wird als ein JSON-Feld in genau einem Firestore-
     Dokument gespeichert (notenbuch/state). Das ist innerhalb des Firestore-Limits
     von 1 MiB pro Dokument und für ein einzelnes Klassenbuch mehr als ausreichend. */

  function initFirebase(){
    try{
      if(window.__firebase && window.__firebase.db){
        fbDocRef = window.__firebase.doc(window.__firebase.db, "notenbuch", "state");
        fbReady = true;
      }
    }catch(e){ fbReady = false; diag.error = (e && e.message) || String(e); }
  }

  async function loadState(){
    let json = null;
    initFirebase();

    if(fbReady){
      try{
        const snap = await window.__firebase.getDoc(fbDocRef);
        if(snap.exists()){
          const data = snap.data();
          if(data && typeof data.json === "string"){
            const j = JSON.parse(data.json);
            if(j && Array.isArray(j.classes)) json = j;
          }
        }
        diag.remoteResolved = true;
      }catch(e){
        diag.error = (e && e.message) || String(e);
      }
    }

    // Falls das Live-Speichern (Firebase) beim letzten Besuch nicht verfügbar war (z. B. offline),
    // kann trotzdem eine lokale Sicherung in diesem Browser existieren — die ist dann aktueller
    // als ein evtl. veralteter/leerer Remote-Stand.
    const local = readLocalBackup();
    if(local && (!json || (local.savedAt||0) > (json.savedAt||0))) json = local;

    if(json){
      // Einmalige Migration: falls die importierte 1c-Klasse noch fehlt, ergänzen (nicht destruktiv).
      if(!json.classes.some(c=>c.importKey==="1c_englisch_import")){
        const built = buildImportedClass();
        const grades = built._grades; delete built._grades;
        json.classes.push(built);
        json.grades = (json.grades||[]).concat(grades);
        if(!json.selectedClassId) json.selectedClassId = built.id;
      }
      return json;
    }
    return seedState();
  }

  const diag = { remoteResolved:false, error:null, lastSaveError:null };

  function diagText(){
    return "Firebase verbunden: " + (fbReady?"ja":"nein") +
      " · letzter Ladeversuch: " + (diag.remoteResolved ? "erfolgreich" : "—") +
      " · letzter Speicherversuch: " + (diag.lastSaveError ? "Fehler ("+diag.lastSaveError+")" : "noch keiner oder erfolgreich") +
      (diag.error ? " · Fehler: "+diag.error : "") +
      " · URL: " + location.href;
  }

  function setSaveDot(cls){
    const dot = document.getElementById("save-dot");
    const label = document.getElementById("save-label");
    if(!dot) return;
    dot.className = "save-dot" + (cls?(" "+cls):"");
    if(label){
      label.textContent =
        cls==="saving" ? "Speichert…" :
        cls==="local" ? "Nur lokal gespeichert (dieser Browser)" :
        cls==="error" ? "Nicht gespeichert (nur Ansicht)" :
        "Gespeichert";
    }
  }

  function scheduleSave(){
    dirty = true;
    setSaveDot("saving");
    clearTimeout(saveTimer);
    saveTimer = setTimeout(doSave, 1200);
  }

  async function doSave(){
    if(!dirty) return;
    state.savedAt = Date.now();
    const localOk = writeLocalBackup(state);

    if(!fbReady){
      dirty = false;
      setSaveDot(localOk ? "local" : "error");
      return;
    }
    try{
      await window.__firebase.setDoc(fbDocRef, { json: JSON.stringify(state), savedAt: state.savedAt });
      dirty = false;
      diag.lastSaveError = null;
      setSaveDot("");
    }catch(err){
      dirty = false;
      diag.lastSaveError = (err && err.code) ? err.code : (err && err.message) || "unbekannt";
      // Remote-Speichern nicht möglich (z. B. offline oder keine Berechtigung) — lokale Sicherung greift.
      setSaveDot(localOk ? "local" : "error");
    }
  }

  async function exportBackup(){
    const stamp = new Date().toISOString().slice(0,10);
    const filename = "notenbuch-sicherung-"+stamp+".json";
    const data = JSON.stringify(state, null, 2);

    if(downloadsApi){
      try{
        await downloadsApi.save({filename, data});
      }catch(err){
        if(err && err.code === "declined") return; // Nutzer hat abgelehnt
        if(err && err.code === "rate_limited"){ await uiAlert("Es läuft bereits eine Speicheranfrage — bitte kurz warten und erneut versuchen."); return; }
        await uiAlert("Download nicht möglich: "+(err&&err.message ? err.message : "unbekannter Fehler"));
      }
      return;
    }

    // Fallback außerhalb der Artifact-Umgebung (z. B. lokal geöffnete Kopie der Datei).
    try{
      const blob = new Blob([data], {type:"application/json"});
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(url), 2000);
    }catch(e){ await uiAlert("Export nicht möglich: "+e.message); }
  }

  function importBackup(file){
    const reader = new FileReader();
    reader.onload = async () => {
      try{
        const json = JSON.parse(reader.result);
        if(!json || !Array.isArray(json.classes)) throw new Error("Ungültiges Format");
        const ok = await uiConfirm("Sicherung importieren? Der aktuell angezeigte Stand wird dabei ersetzt.", {okLabel:"Importieren"});
        if(!ok) return;
        state = json;
        dirty = true;
        scheduleSave();
        render();
      }catch(e){ await uiAlert("Import fehlgeschlagen: "+e.message); }
    };
    reader.readAsText(file);
  }

  /* ============================= DATEI-DOWNLOAD (generisch) =============================
     Nutzt die downloads-Capability (mit Bestätigungsdialog beim Nutzer); außerhalb der
     Artifact-Umgebung (z. B. lokal geöffnete Kopie) ein klassischer Blob-Link als Fallback.
     Gibt true (heruntergeladen), false (abgebrochen/Fehler, bereits gemeldet) oder den
     String "unsupported" zurück (Dateiendung in dieser Ansicht nicht zulässig). */
  async function downloadFile(filename, data, mime){
    if(downloadsApi){
      try{
        await downloadsApi.save({filename, data});
        return true;
      }catch(err){
        if(err && err.code === "declined") return false;
        if(err && err.code === "rate_limited"){ await uiAlert("Es läuft bereits eine Speicheranfrage — bitte kurz warten und erneut versuchen."); return false; }
        if(err && (err.code === "rejected_extension" || err.code === "extension_not_enabled")) return "unsupported";
        await uiAlert("Download nicht möglich: "+(err&&err.message ? err.message : "unbekannter Fehler"));
        return false;
      }
    }
    try{
      const blob = (data instanceof Blob) ? data : new Blob([data], {type:mime||"application/octet-stream"});
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(url), 2000);
      return true;
    }catch(e){ await uiAlert("Export nicht möglich: "+e.message); return false; }
  }

  /* ============================= XLSX-EXPORT (eigener, minimaler Writer) =============================
     Erzeugt eine echte .xlsx-Datei (ZIP-Container ohne Kompression + OOXML) direkt im Browser —
     ohne externe Bibliothek, da im Artifact-Frame keine externen Skripte geladen werden können. */
  const XLSX_CRC_TABLE = (function(){
    const t = new Uint32Array(256);
    for(let n=0;n<256;n++){
      let c = n;
      for(let k=0;k<8;k++){ c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1); }
      t[n] = c >>> 0;
    }
    return t;
  })();
  function xlsxCrc32(bytes){
    let c = 0xFFFFFFFF;
    for(let i=0;i<bytes.length;i++){ c = XLSX_CRC_TABLE[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8); }
    return (c ^ 0xFFFFFFFF) >>> 0;
  }
  function xlsxMakeZip(files){
    // files: [{name, data:Uint8Array}] — ZIP im "store"-Verfahren (unkomprimiert, spezifikationskonform).
    const chunks = [];
    const central = [];
    let offset = 0;
    const dosTime = 0, dosDate = 0x21;
    files.forEach(f=>{
      const nameBytes = new TextEncoder().encode(f.name);
      const data = f.data;
      const crc = xlsxCrc32(data);
      const local = new Uint8Array(30 + nameBytes.length);
      const dv = new DataView(local.buffer);
      dv.setUint32(0, 0x04034b50, true);
      dv.setUint16(4, 20, true);
      dv.setUint16(6, 0, true);
      dv.setUint16(8, 0, true);
      dv.setUint16(10, dosTime, true);
      dv.setUint16(12, dosDate, true);
      dv.setUint32(14, crc, true);
      dv.setUint32(18, data.length, true);
      dv.setUint32(22, data.length, true);
      dv.setUint16(26, nameBytes.length, true);
      dv.setUint16(28, 0, true);
      local.set(nameBytes, 30);
      chunks.push(local, data);

      const centralEntry = new Uint8Array(46 + nameBytes.length);
      const cdv = new DataView(centralEntry.buffer);
      cdv.setUint32(0, 0x02014b50, true);
      cdv.setUint16(4, 20, true);
      cdv.setUint16(6, 20, true);
      cdv.setUint16(8, 0, true);
      cdv.setUint16(10, 0, true);
      cdv.setUint16(12, dosTime, true);
      cdv.setUint16(14, dosDate, true);
      cdv.setUint32(16, crc, true);
      cdv.setUint32(20, data.length, true);
      cdv.setUint32(24, data.length, true);
      cdv.setUint16(28, nameBytes.length, true);
      cdv.setUint32(38, 0, true);
      cdv.setUint32(42, offset, true);
      centralEntry.set(nameBytes, 46);
      central.push(centralEntry);

      offset += local.length + data.length;
    });
    const centralStart = offset;
    let centralSize = 0;
    central.forEach(c=>{ chunks.push(c); centralSize += c.length; });
    const end = new Uint8Array(22);
    const edv = new DataView(end.buffer);
    edv.setUint32(0, 0x06054b50, true);
    edv.setUint16(8, files.length, true);
    edv.setUint16(10, files.length, true);
    edv.setUint32(12, centralSize, true);
    edv.setUint32(16, centralStart, true);
    chunks.push(end);
    let total = 0; chunks.forEach(c=>total+=c.length);
    const out = new Uint8Array(total);
    let p = 0; chunks.forEach(c=>{ out.set(c, p); p += c.length; });
    return out;
  }
  function xlsxXmlEscape(s){
    return String(s==null?"":s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&apos;"}[c]));
  }
  function xlsxColLetter(n){
    let s = "", m = n+1;
    while(m>0){ const r=(m-1)%26; s = String.fromCharCode(65+r)+s; m = Math.floor((m-1)/26); }
    return s;
  }
  // colMeta: [{width, style}] — style: "grade"|"pct"|null je Spalte (bestimmt Zellformat/Farbe je nach Wert)
  function xlsxSheetXml(header, rows, colMeta){
    const nCols = header.length;
    const cols = "<cols>"+colMeta.map((m,i)=>'<col min="'+(i+1)+'" max="'+(i+1)+'" width="'+(m.width||14)+'" customWidth="1"/>').join("")+"</cols>";
    let body = "";
    // Kopfzeile
    body += '<row r="1" s="1">';
    header.forEach((h,i)=>{
      body += '<c r="'+xlsxColLetter(i)+'1" t="inlineStr" s="1"><is><t xml:space="preserve">'+xlsxXmlEscape(h)+'</t></is></c>';
    });
    body += "</row>";
    rows.forEach((row,ri)=>{
      const r = ri+2;
      body += '<row r="'+r+'">';
      row.forEach((val,ci)=>{
        const ref = xlsxColLetter(ci)+r;
        const meta = colMeta[ci] || {};
        let styleIdx = 0;
        if(meta.style==="grade" && typeof val === "number" && val>=1 && val<=5) styleIdx = 1 + Math.round(val); // 2..6
        else if(meta.style==="pct") styleIdx = 7;
        else if(meta.style==="num") styleIdx = 8;
        if(typeof val === "number" && isFinite(val)){
          body += '<c r="'+ref+'"'+(styleIdx?' s="'+styleIdx+'"':'')+'><v>'+val+'</v></c>';
        } else if(val==null || val===""){
          if(styleIdx) body += '<c r="'+ref+'" s="'+styleIdx+'"/>';
        } else {
          body += '<c r="'+ref+'" t="inlineStr"'+(styleIdx?' s="'+styleIdx+'"':'')+'><is><t xml:space="preserve">'+xlsxXmlEscape(val)+'</t></is></c>';
        }
      });
      body += "</row>";
    });
    const dim = xlsxColLetter(nCols-1)+(rows.length+1);
    return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
      '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">'+
      '<dimension ref="A1:'+dim+'"/>'+
      '<sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews>'+
      '<sheetFormatPr defaultRowHeight="15"/>'+
      cols+
      '<sheetData>'+body+'</sheetData>'+
      '<autoFilter ref="A1:'+dim+'"/>'+
      '</worksheet>';
  }
  function xlsxStylesXml(){
    // Fixe, kompakte Style-Tabelle: 0 Standard, 1 Kopfzeile (fett, dunkler Fond, weiße Schrift),
    // 2–6 Notenfarben (1–5, wie in der App), 7 Prozent, 8 Zahl mit 1 Nachkommastelle.
    const gradeColors = ["", "FF0CA30C", "FF6B9C1F", "FFC98E00", "FFD9663A", "FFD03B3B"]; // Index 1..5
    let fills = '<fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill>';
    fills += '<fill><patternFill patternType="solid"><fgColor rgb="FF1F3B33"/><bgColor indexed="64"/></patternFill></fill>'; // 2: Kopf
    for(let g=1; g<=5; g++){
      fills += '<fill><patternFill patternType="solid"><fgColor rgb="'+gradeColors[g]+'"/><bgColor indexed="64"/></patternFill></fill>';
    }
    const numFmts = '<numFmts count="1"><numFmt numFmtId="164" formatCode="0.0"/></numFmts>';
    const fonts = '<fonts count="3">'+
      '<font><sz val="11"/><name val="Calibri"/></font>'+
      '<font><b/><sz val="11"/><color rgb="FFFFFFFF"/><name val="Calibri"/></font>'+
      '<font><b/><sz val="11"/><color rgb="FFFFFFFF"/><name val="Calibri"/></font>'+
      '</fonts>';
    const borders = '<borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders>';
    const cellXfs = '<cellXfs count="9">'+
      '<xf numFmtId="0" fontId="0" fillId="0" borderId="0"/>'+ // 0 Standard
      '<xf numFmtId="0" fontId="1" fillId="2" borderId="0" applyFont="1" applyFill="1"><alignment vertical="center"/></xf>'+ // 1 Kopf
      '<xf numFmtId="0" fontId="2" fillId="3" borderId="0" applyFont="1" applyFill="1"/>'+ // 2 Note 1
      '<xf numFmtId="0" fontId="2" fillId="4" borderId="0" applyFont="1" applyFill="1"/>'+ // 3 Note 2
      '<xf numFmtId="0" fontId="2" fillId="5" borderId="0" applyFont="1" applyFill="1"/>'+ // 4 Note 3
      '<xf numFmtId="0" fontId="2" fillId="6" borderId="0" applyFont="1" applyFill="1"/>'+ // 5 Note 4
      '<xf numFmtId="0" fontId="2" fillId="7" borderId="0" applyFont="1" applyFill="1"/>'+ // 6 Note 5
      '<xf numFmtId="164" fontId="0" fillId="0" borderId="0" applyNumberFormat="1"/>'+ // 7 Prozent (als Zahl formatiert, "%"-Zeichen im Wert)
      '<xf numFmtId="164" fontId="0" fillId="0" borderId="0" applyNumberFormat="1"/>'+ // 8 Zahl 1 Nachkommastelle
      '</cellXfs>';
    return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
      '<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">'+
      numFmts+fonts+'<fills count="8">'+fills+'</fills>'+borders+
      '<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>'+
      cellXfs+
      '<cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles>'+
      '</styleSheet>';
  }
  // Baut eine vollständige .xlsx-Datei (Blob) aus Kopfzeile + Zeilen.
  function buildXlsxBlob(sheetName, header, rows, colMeta){
    const enc = new TextEncoder();
    const safeSheetName = xlsxXmlEscape((sheetName||"Export").slice(0,28));
    const contentTypes = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
      '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">'+
      '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>'+
      '<Default Extension="xml" ContentType="application/xml"/>'+
      '<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>'+
      '<Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>'+
      '<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>'+
      '</Types>';
    const rootRels = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
      '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+
      '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>'+
      '</Relationships>';
    const workbook = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
      '<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">'+
      '<sheets><sheet name="'+safeSheetName+'" sheetId="1" r:id="rId1"/></sheets>'+
      '</workbook>';
    const workbookRels = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
      '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+
      '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/>'+
      '<Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>'+
      '</Relationships>';
    const sheet = xlsxSheetXml(header, rows, colMeta);
    const styles = xlsxStylesXml();

    const files = [
      {name:"[Content_Types].xml", data: enc.encode(contentTypes)},
      {name:"_rels/.rels", data: enc.encode(rootRels)},
      {name:"xl/workbook.xml", data: enc.encode(workbook)},
      {name:"xl/_rels/workbook.xml.rels", data: enc.encode(workbookRels)},
      {name:"xl/styles.xml", data: enc.encode(styles)},
      {name:"xl/worksheets/sheet1.xml", data: enc.encode(sheet)},
    ];
    const zipBytes = xlsxMakeZip(files);
    return new Blob([zipBytes], {type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
  }

  async function exportRowsAsXlsx(filenameBase, sheetName, header, rows, colMeta){
    const blob = buildXlsxBlob(sheetName, header, rows, colMeta);
    const result = await downloadFile(filenameBase+".xlsx", blob);
    if(result === "unsupported"){
      const wantPdf = await uiConfirm("Excel-Dateien (.xlsx) können in dieser Ansicht nicht heruntergeladen werden. Stattdessen als PDF exportieren?", {okLabel:"Als PDF exportieren"});
      return wantPdf ? "fallback-pdf" : false;
    }
    return result;
  }

  /* ============================= PDF-EXPORT (eigener, minimaler Writer) =============================
     Erzeugt eine echte .pdf-Datei direkt im Browser (kein window.print()/Druckdialog — der ist im
     sandboxten Artifact-Frame ohne "allow-modals" blockiert, genau wie window.alert/confirm/prompt). */
  function pdfEscapeText(s){
    return String(s==null?"":s).replace(/\\/g,"\\\\").replace(/\(/g,"\\(").replace(/\)/g,"\\)");
  }
  // Wandelt einen JS-String in einen "Binär-String" (ein Zeichen = ein Byte) für WinAnsiEncoding.
  // Deutsche Umlaute/ß liegen im gleichen Codebereich wie Latin-1/WinAnsi (Clamp genügt); Gedankenstriche,
  // typografische Anführungszeichen & Auslassungspunkte liegen bei WinAnsi jedoch auf anderen Byte-Positionen
  // als ihr Unicode-Codepoint (Windows-1252-Sonderbereich 0x80–0x9F) und werden daher explizit gemappt.
  const PDF_WINANSI_MAP = {0x2014:0x97,0x2013:0x96,0x2026:0x85,0x2018:0x91,0x2019:0x92,0x201C:0x93,0x201D:0x94,0x2022:0x95};
  function pdfLatin1(s){
    let str = String(s==null?"":s).replace(/✓/g,"OK").replace(/∀/g,"exkl.");
    let out = "";
    for(let i=0;i<str.length;i++){
      const code = str.charCodeAt(i);
      if(PDF_WINANSI_MAP[code]!=null) out += String.fromCharCode(PDF_WINANSI_MAP[code]);
      else out += String.fromCharCode(code>255 ? 63 : code); // '?' als letzter Fallback
    }
    return out;
  }
  function pdfTruncate(text, maxChars){
    if(text.length<=maxChars) return text;
    return maxChars>1 ? text.slice(0, maxChars-1)+"." : text.slice(0,1);
  }

  function buildPdfBytes(title, subtitle, header, rows, colMeta){
    const PAGE_H = 595, MARGIN = 26; // A4-Höhe, Breite passt sich der Spaltenzahl an
    const headerRowH = 20, dataRowH = 14, topBlockH = 46;
    const rowsPerPage = Math.max(6, Math.floor((PAGE_H - 2*MARGIN - topBlockH - headerRowH) / dataRowH));

    // Jede Spalte bekommt eine an ihrem Inhalt orientierte Mindestbreite in pt, damit auch
    // Tabellen mit vielen Spalten (z. B. Punkte je Teilbereich) nicht übermäßig abgeschnitten werden.
    const colW = colMeta.map(m=>Math.max(48, (m.width||14)*7.2));
    const usableW = colW.reduce((a,w)=>a+w,0);
    const PAGE_W = Math.max(595, usableW + 2*MARGIN);
    const colX = []; let cx = MARGIN;
    colW.forEach(w=>{ colX.push(cx); cx += w; });

    const gradeColors = {1:"0.047 0.639 0.047",2:"0.42 0.61 0.12",3:"0.788 0.557 0",4:"0.851 0.4 0.227",5:"0.816 0.231 0.231"};
    const stamp = new Date().toLocaleDateString("de-AT", {day:"2-digit",month:"2-digit",year:"numeric"});
    const totalPagesGuess = Math.max(1, Math.ceil(rows.length/rowsPerPage));

    function drawHeaderBlock(pageNum){
      let c = "";
      c += "0.11 0.23 0.20 rg\nBT /F2 14 Tf "+MARGIN+" "+(PAGE_H-MARGIN)+" Td ("+pdfEscapeText(pdfLatin1(title))+") Tj ET\n";
      c += "0.4 0.4 0.4 rg\nBT /F1 8 Tf "+(PAGE_W-MARGIN-110)+" "+(PAGE_H-MARGIN)+" Td (Erstellt am "+stamp+" \\267 Seite "+pageNum+"/"+totalPagesGuess+") Tj ET\n";
      let y = PAGE_H-MARGIN-15;
      if(subtitle){
        c += "0.33 0.33 0.33 rg\nBT /F1 9 Tf "+MARGIN+" "+y+" Td ("+pdfEscapeText(pdfLatin1(subtitle))+") Tj ET\n";
        y -= 13;
      }
      c += "0.11 0.23 0.20 RG 1.2 w "+MARGIN+" "+y+" m "+(PAGE_W-MARGIN)+" "+y+" l S\n";
      return {content:c, y: y-10};
    }

    const pages = [];
    for(let start=0; start<Math.max(rows.length,1); start+=rowsPerPage){
      const pageRows = rows.slice(start, start+rowsPerPage);
      const head = drawHeaderBlock(pages.length+1);
      let content = head.content;
      let y = head.y;

      content += "0.122 0.231 0.20 rg "+MARGIN+" "+(y-headerRowH+5)+" "+usableW+" "+headerRowH+" re f\n1 1 1 rg\n";
      header.forEach((h,ci)=>{
        const maxChars = Math.max(3, Math.floor(colW[ci]/4.1));
        content += "BT /F2 7.3 Tf "+(colX[ci]+3)+" "+(y-headerRowH+11)+" Td ("+pdfEscapeText(pdfLatin1(pdfTruncate(String(h), maxChars)))+") Tj ET\n";
      });
      y -= headerRowH;

      pageRows.forEach((row,ri)=>{
        if(ri%2===1) content += "0.953 0.945 0.918 rg "+MARGIN+" "+(y-dataRowH+4)+" "+usableW+" "+dataRowH+" re f\n";
        row.forEach((val,ci)=>{
          const meta = colMeta[ci]||{};
          const text = val==null ? "" : String(val);
          if(!text) return;
          let colorCmd = "0.13 0.13 0.13 rg";
          let font = "/F1 7.3";
          if(meta.style==="grade" && typeof val==="number" && val>=1 && val<=5){
            colorCmd = gradeColors[Math.round(val)]+" rg";
            font = "/F2 7.3";
          }
          const maxChars = Math.max(3, Math.floor(colW[ci]/3.9));
          content += colorCmd+"\nBT "+font+" Tf "+(colX[ci]+3)+" "+(y-dataRowH+5)+" Td ("+pdfEscapeText(pdfLatin1(pdfTruncate(text, maxChars)))+") Tj ET\n";
        });
        y -= dataRowH;
      });
      pages.push(content);
    }

    // ---- Objekte zusammensetzen ----
    const fontHelv = "<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>";
    const fontHelvBold = "<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>";
    const nPages = pages.length;
    let nextNum = 5;
    const contentNums = [], pageNums = [];
    for(let i=0;i<nPages;i++){ contentNums.push(nextNum++); pageNums.push(nextNum++); }

    const objects = {};
    objects[1] = "<< /Type /Catalog /Pages 2 0 R >>";
    objects[2] = "<< /Type /Pages /Kids ["+pageNums.map(n=>n+" 0 R").join(" ")+"] /Count "+nPages+" >>";
    objects[3] = fontHelv;
    objects[4] = fontHelvBold;
    for(let i=0;i<nPages;i++){
      objects[contentNums[i]] = {stream: pages[i]};
      objects[pageNums[i]] = "<< /Type /Page /Parent 2 0 R /MediaBox [0 0 "+PAGE_W+" "+PAGE_H+"] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents "+contentNums[i]+" 0 R >>";
    }

    let out = "%PDF-1.4\n%\xE2\xE3\xCF\xD3\n";
    const maxObjNum = 4 + nPages*2;
    const offsets = [];
    for(let n=1;n<=maxObjNum;n++){
      offsets[n] = out.length;
      const body = objects[n];
      if(body && typeof body === "object"){
        out += n+" 0 obj\n<< /Length "+body.stream.length+" >>\nstream\n"+body.stream+"\nendstream\nendobj\n";
      } else {
        out += n+" 0 obj\n"+body+"\nendobj\n";
      }
    }
    const xrefStart = out.length;
    out += "xref\n0 "+(maxObjNum+1)+"\n0000000000 65535 f \n";
    for(let n=1;n<=maxObjNum;n++) out += String(offsets[n]).padStart(10,"0")+" 00000 n \n";
    out += "trailer\n<< /Size "+(maxObjNum+1)+" /Root 1 0 R >>\nstartxref\n"+xrefStart+"\n%%EOF";

    const bytes = new Uint8Array(out.length);
    for(let i=0;i<out.length;i++) bytes[i] = out.charCodeAt(i) & 0xFF;
    return bytes;
  }

  async function exportRowsAsPdf(filenameBase, title, subtitle, header, rows, colMeta){
    const bytes = buildPdfBytes(title, subtitle, header, rows, colMeta);
    const blob = new Blob([bytes], {type:"application/pdf"});
    const result = await downloadFile(filenameBase+".pdf", blob);
    if(result === "unsupported"){
      await uiAlert("PDF-Dateien können in dieser Ansicht aktuell nicht heruntergeladen werden. Bitte weiche vorübergehend auf „Sicherung herunterladen (.json)“ unter Einstellungen aus oder versuche es später erneut.");
    }
    return result;
  }

  /* ============================= CALCULATIONS ============================= */
  function gradesFor(classId, subjectId, categoryId, studentId){
    return state.grades.filter(g=>g.classId===classId && g.subjectId===subjectId &&
      (categoryId===undefined || g.categoryId===categoryId) &&
      (studentId===undefined || g.studentId===studentId));
  }

  function categoryAverage(classId, subjectId, categoryId, studentId){
    const gs = gradesFor(classId, subjectId, categoryId, studentId).filter(g=>!g.excluded && g.value!=null);
    if(!gs.length) return null;
    let sumV=0, sumM=0;
    gs.forEach(g=>{ const m = g.mult>0?g.mult:1; sumV += g.value*m; sumM += m; });
    return sumV/sumM;
  }

  function roundGrade(avg){
    if(avg==null) return null;
    let r;
    if(state.settings.rounding === "down"){
      // .5 rounds toward the better (lower) grade
      r = Math.ceil(avg - 0.5);
    } else {
      r = Math.round(avg);
    }
    return Math.min(5, Math.max(1, r));
  }

  function subjectResult(classId, subjectId, studentId){
    const cls = state.classes.find(c=>c.id===classId);
    const subject = cls.subjects.find(s=>s.id===subjectId);
    let sumW=0, sumWV=0, anyData=false;
    subject.categories.forEach(cat=>{
      const avg = categoryAverage(classId, subjectId, cat.id, studentId);
      if(avg!=null){
        anyData = true;
        sumW += cat.weight;
        sumWV += avg*cat.weight;
      }
    });
    if(!anyData || sumW===0) return {raw:null, rounded:null};
    const raw = sumWV/sumW;
    return {raw, rounded: roundGrade(raw)};
  }

  function classSubjectAverage(classId, subjectId){
    const cls = state.classes.find(c=>c.id===classId);
    const vals = cls.students.map(s=>subjectResult(classId, subjectId, s.id).raw).filter(v=>v!=null);
    if(!vals.length) return null;
    return vals.reduce((a,b)=>a+b,0)/vals.length;
  }

  function weightSum(subject){
    return subject.categories.reduce((a,c)=>a+(Number(c.weight)||0),0);
  }

  function gradeTag(g){
    if(g.excluded) return el("span",{class:"tag tag-none"},"∀ ausgenommen");
    const rounded = Math.round(g.value);
    const label = g.symbol ? g.symbol : (g.value%1===0 ? String(g.value) : g.value.toFixed(2).replace(".",","));
    const t = el("span",{class:"tag "+tagClassFor(rounded)}, label);
    if(g.detail){
      tooltip(t, g.detail.parts.map(p=>p.name+": "+p.points+"/"+p.max).join(" · ")+" · "+g.detail.percent.toFixed(0)+"% → Note "+g.value);
    } else if(g.symbol){
      tooltip(t, "Note "+g.value.toFixed(2).replace(".",","));
    }
    return t;
  }

  function tagClassFor(rounded){
    if(rounded==null) return "tag-none";
    return "tag-"+rounded;
  }
  function colorVarFor(rounded){
    return {1:"var(--good-1)",2:"var(--good-2)",3:"var(--neutral-3)",4:"var(--warn-4)",5:"var(--crit-5)"}[rounded] || "var(--ink-faint)";
  }

  /* ============================= RENDER HELPERS ============================= */
  function el(tag, attrs, ...children){
    const e = document.createElement(tag);
    if(attrs) Object.entries(attrs).forEach(([k,v])=>{
      if(k==="class") e.className = v;
      else if(k==="html") e.innerHTML = v;
      else if(k.startsWith("on") && typeof v === "function") e.addEventListener(k.slice(2), v);
      else if(v!==false && v!=null) e.setAttribute(k, v);
    });
    children.flat().forEach(c=>{
      if(c==null) return;
      e.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
    });
    return e;
  }

  /* ============================= UI-DIALOGE =============================
     Native window.prompt/confirm/alert werden im sandboxten Artifact-Frame
     nicht zugelassen (kein allow-modals) und tun dort nichts. Eigene,
     einfache Dialoge als Ersatz. */
  function closeUiModal(){
    const existing = document.getElementById("ui-modal-root");
    if(existing) existing.remove();
    document.removeEventListener("keydown", uiModalEscHandler);
  }
  function uiModalEscHandler(e){ if(e.key==="Escape") closeUiModal(); }

  function openUiModal(build){
    closeUiModal();
    const backdrop = el("div",{id:"ui-modal-root", class:"modal-backdrop"});
    const modal = el("div",{class:"modal"});
    backdrop.appendChild(modal);
    backdrop.addEventListener("mousedown",(e)=>{ if(e.target===backdrop) closeUiModal(); });
    document.addEventListener("keydown", uiModalEscHandler);
    document.body.appendChild(backdrop);
    build(modal, closeUiModal);
    return modal;
  }

  function uiAlert(message, title){
    return new Promise(resolve=>{
      openUiModal((modal, close)=>{
        modal.appendChild(el("div",{class:"card-head"}, el("h3",{},title||"Hinweis")));
        modal.appendChild(el("div",{class:"card-body"}, el("p",{style:"color:var(--ink-muted);font-size:13.5px;margin:0;"}, message)));
        const foot = el("div",{class:"foot"});
        const okBtn = el("button",{class:"btn btn-primary btn-sm", onclick:()=>{ close(); resolve(); }}, "OK");
        foot.appendChild(okBtn);
        modal.appendChild(foot);
        setTimeout(()=>okBtn.focus(),0);
      });
    });
  }

  function uiConfirm(message, opts){
    opts = opts||{};
    return new Promise(resolve=>{
      let settled = false;
      const finish = (v)=>{ if(settled) return; settled = true; resolve(v); };
      openUiModal((modal, close)=>{
        modal.appendChild(el("div",{class:"card-head"}, el("h3",{},opts.title||"Bestätigen")));
        modal.appendChild(el("div",{class:"card-body"}, el("p",{style:"color:var(--ink-muted);font-size:13.5px;margin:0;"}, message)));
        const foot = el("div",{class:"foot"});
        foot.appendChild(el("button",{class:"btn btn-sm", onclick:()=>{ close(); finish(false); }}, "Abbrechen"));
        const okBtn = el("button",{class:"btn btn-sm "+(opts.danger?"btn-danger":"btn-primary"), onclick:()=>{ close(); finish(true); }}, opts.okLabel||"Löschen");
        foot.appendChild(okBtn);
        modal.appendChild(foot);
        setTimeout(()=>okBtn.focus(),0);
      });
      // Falls per Backdrop/Escape geschlossen wird, zählt das als Abbrechen.
      const obs = new MutationObserver(()=>{
        if(!document.getElementById("ui-modal-root")){ finish(false); obs.disconnect(); }
      });
      obs.observe(document.body, {childList:true});
    });
  }

  function uiPrompt(message, defaultValue, opts){
    opts = opts||{};
    return new Promise(resolve=>{
      let settled = false;
      const finish = (v)=>{ if(settled) return; settled = true; resolve(v); };
      openUiModal((modal, close)=>{
        modal.appendChild(el("div",{class:"card-head"}, el("h3",{},opts.title||"Eingabe")));
        const body = el("div",{class:"card-body"});
        if(message) body.appendChild(el("p",{style:"color:var(--ink-muted);font-size:13.5px;margin:0;"}, message));
        const input = el("input",{type:"text", placeholder:opts.placeholder||""});
        input.value = defaultValue||"";
        body.appendChild(input);
        modal.appendChild(body);
        const foot = el("div",{class:"foot"});
        foot.appendChild(el("button",{class:"btn btn-sm", onclick:()=>{ close(); finish(null); }}, "Abbrechen"));
        const okBtn = el("button",{class:"btn btn-primary btn-sm", onclick:()=>{ const v=input.value.trim(); close(); finish(v||null); }}, opts.okLabel||"OK");
        foot.appendChild(okBtn);
        modal.appendChild(foot);
        input.addEventListener("keydown",(e)=>{
          if(e.key==="Enter"){ e.preventDefault(); okBtn.click(); }
        });
        setTimeout(()=>input.focus(),0);
      });
      const obs = new MutationObserver(()=>{
        if(!document.getElementById("ui-modal-root")){ finish(null); obs.disconnect(); }
      });
      obs.observe(document.body, {childList:true});
    });
  }

  function icon(name){ const s = el("span",{html:ICONS[name]||""}); return s; }

  function tooltip(target, text){
    target.addEventListener("mousemove", (e)=>{
      let tip = document.getElementById("tt");
      if(!tip){
        tip = el("div",{id:"tt", class:"tooltip show"});
        document.getElementById("tooltip-root").appendChild(tip);
      }
      tip.textContent = text;
      tip.style.left = e.clientX + "px";
      tip.style.top = e.clientY + "px";
      tip.classList.add("show");
    });
    target.addEventListener("mouseleave", ()=>{
      const tip = document.getElementById("tt");
      if(tip) tip.classList.remove("show");
    });

  // Navigations-Einträge der Seitenleiste: Symbol + Beschriftung + zugehöriger Tab.

  // Zustand (nur Symbole, siehe .sidebar.collapsed) identisch aufgebaut werden.
  const SIDEBAR_NAV = [
    {tab:"eingabe", icon:"book", label:"Klassenkonfiguration"},
    {tab:"sammel", icon:"grid", label:"Leistungseingabe"},

  function renderSidebar(){
    const cls = currentClass();
    const sidebar = el("div",{class:"sidebar"+(sidebarCollapsed?" collapsed":"")});
    sidebar.appendChild(el("div",{class:"brand-row"},
      el("div",{class:"brand"},
        el("div",{class:"mark"},"N"),

      ),
      el("button",{

        title: sidebarCollapsed ? "Menü ausklappen" : "Menü einklappen",
        onclick:()=>{ sidebarCollapsed = !sidebarCollapsed; render(); }
      }, icon("chevronDown"))
    ));

    const tabWrap = el("div",{class:"side-section"});
    SIDEBAR_NAV.forEach(entry=>{
      if(entry.children){
        const isOpen = !navGroupCollapse[entry.group] || entry.children.some(c=>c.tab===state.activeTab);
        if(!sidebarCollapsed){
          tabWrap.appendChild(el("button",{
            class:"nav-tab nav-group-toggle",
            type:"button",
            title: entry.label,
            onclick:()=>{ navGroupCollapse[entry.group] = !navGroupCollapse[entry.group]; render(); }
          }, icon(entry.icon), el("span",{class:"nav-label"}, entry.label), el("span",{class:"chev"+(isOpen?" open":"")}, icon("chevronDown"))));
        }
        if(sidebarCollapsed || isOpen){
          entry.children.forEach(child=>{

              class:"nav-tab nav-subtab"+(state.activeTab===child.tab?" active":""),

  // Baut eine ein-/ausklappbare Karte (natives <details>/<summary>), deren Auf-/Zu-Status in
  // sectionCollapse persistiert wird — bleibt so auch nach einem Re-Render (z. B. nach dem
  // Hinzufügen eines Schülers) erhalten, statt bei jeder Änderung wieder zuzuklappen.
  function collapsibleCard(key, headChildren){
    const card = el("details",{class:"card collapsible-card", open: sectionCollapse[key] ? false : true});
    card.addEventListener("toggle", ()=>{ sectionCollapse[key] = !card.open; });
    card.appendChild(el("summary",{class:"card-head"}, ...headChildren, el("span",{class:"chev"}, icon("chevronDown"))));
    const body = el("div",{class:"card-body"});
    card.appendChild(body);
    return {card, body};
  }

  function renderGradeEntryCard(cls){
    const {card, body} = collapsibleCard("einzelnote", [el("h3",{},"Einzelnote eintragen")]);

    if(!cls.students.length || !cls.subjects.length){
      body.appendChild(el("div",{class:"empty-state"}, el("p",{},"Lege zuerst mindestens einen Schüler und ein Fach mit Kategorie an.")));
      card.appendChild(body);
      return card;
    }

    const studentSel = el("select",{}, ...cls.students.map(s=>el("option",{value:s.id},s.name)));
    const subjectSel = el("select",{}, ...cls.subjects.map(s=>el("option",{value:s.id},s.name)));
    const catSel = el("select",{});
    const dynWrap = el("div",{class:"form-row", style:"flex:1 1 100%;margin:0;"});
    const dateInput = el("input",{type:"date", value:new Date().toISOString().slice(0,10)});
    const leistungDatalistId = "leistung-suggest-"+cls.id;
    const leistungInput = el("input",{type:"text", placeholder:"z. B. „2. Test“, „Hausübung KW12“", list:leistungDatalistId, style:"min-width:190px;"});
    const leistungDatalist = el("datalist",{id:leistungDatalistId});
    let collectExtra = ()=>({value:1, mult:1});

    function currentSubject(){ return cls.subjects.find(s=>s.id===subjectSel.value); }
    function currentCategory(){ const subj = currentSubject(); return subj ? subj.categories.find(c=>c.id===catSel.value) : null; }

    function refreshLeistungSuggestions(){
      leistungDatalist.innerHTML = "";
      const cat = currentCategory();
      if(!cat) return;
      const names = Array.from(new Set(
        state.leistungen.filter(l=>l.classId===cls.id && l.categoryId===cat.id).map(l=>l.name)
      ));
      names.forEach(n=>leistungDatalist.appendChild(el("option",{value:n})));
    }

    // Findet eine bestehende Leistung mit gleichem Namen/Datum/Kategorie oder legt eine neue an.
    function resolveLeistung(subj, cat, name, date){
      const finalName = (name||"").trim() || (cat.name+" "+date);
      let match = state.leistungen.find(l=>l.classId===cls.id && l.subjectId===subj.id && l.categoryId===cat.id && l.name===finalName && l.date===date);
      if(!match){
        match = {id:uid("lst"), classId:cls.id, subjectId:subj.id, categoryId:cat.id, name:finalName, date};
        state.leistungen.push(match);
      }
      return match;
    }

    function refreshCats(){
      catSel.innerHTML = "";
      const subj = currentSubject();
      (subj?subj.categories:[]).forEach(c=>catSel.appendChild(el("option",{value:c.id}, c.name+" ("+c.weight+"%)")));
      refreshDynamic();
      refreshLeistungSuggestions();
    }

    function refreshDynamic(){
      dynWrap.innerHTML = "";
      const cat = currentCategory();
      if(!cat){ collectExtra = ()=>null; return; }

      if(cat.type==="punkte"){
        const subskills = (cat.subskills && cat.subskills.length) ? cat.subskills : DEFAULT_SUBSKILLS;
        const rowInputs = subskills.map(sk=>{
          const pInput = el("input",{type:"number", value:"", min:"0", step:"0.5", placeholder:"Pkt", style:"width:64px;"});
          const mInput = el("input",{type:"number", value:sk.max, min:"0", step:"0.5", style:"width:56px;"});
          dynWrap.appendChild(el("label",{class:"field", style:"flex:0 0 auto;min-width:118px;"}, sk.name,
            el("div",{style:"display:flex;gap:4px;align-items:center;"}, pInput, el("span",{style:"color:var(--ink-faint);font-size:12px;"},"/"), mInput)
          ));
          return {name:sk.name, pInput, mInput};
        });
        const suggestBadge = el("span",{class:"tag tag-none"},"–");
        const gradeSel = el("select",{}, [1,2,3,4,5].map(v=>el("option",{value:v}, v+" – "+GRADE_LABELS[v])));
        function recompute(){
          let sumP=0, sumM=0, any=false;
          rowInputs.forEach(r=>{
            const p = parseFloat((r.pInput.value||"").replace(",","."));
            const m = parseFloat((r.mInput.value||"").replace(",","."));
            if(!isNaN(p) && m>0){ sumP+=p; sumM+=m; any=true; }
          });
          if(any && sumM>0){
            const pct = (sumP/sumM)*100;
            const suggested = percentToMark(pct, effectiveLevel(currentSubject()));
            suggestBadge.className = "tag "+tagClassFor(suggested);
            suggestBadge.textContent = pct.toFixed(0)+"% → "+suggested;
            gradeSel.value = String(suggested);
          } else {
            suggestBadge.className = "tag tag-none";
            suggestBadge.textContent = "–";
          }
        }
        rowInputs.forEach(r=>{ r.pInput.addEventListener("input", recompute); r.mInput.addEventListener("input", recompute); });
        dynWrap.appendChild(el("label",{class:"field", style:"flex:0 0 auto;"},"Vorschlag", suggestBadge));
        dynWrap.appendChild(el("label",{class:"field", style:"flex:0 0 auto;min-width:150px;"},"Note (bestätigen)", gradeSel));
        collectExtra = ()=>{
          const parts = rowInputs.map(r=>({name:r.name, points:parseFloat((r.pInput.value||"0").replace(",","."))||0, max:parseFloat((r.mInput.value||"0").replace(",","."))||0}));
          const sumP = parts.reduce((a,p)=>a+p.points,0), sumM = parts.reduce((a,p)=>a+p.max,0);
          return {value:Number(gradeSel.value), mult:1, detail:{parts, totalPoints:sumP, totalMax:sumM, percent: sumM>0?(sumP/sumM)*100:null}};
        };
      } else if(cat.type==="hausuebung" || cat.type==="mitarbeit"){
        const symbols = symbolsFor(cat.type);
        const symSel = el("select",{}, symbols.map(s=>el("option",{value:s.sym}, s.sym+" — "+s.label)));

  /* ============================= SAMMELEINGABE ============================= */
  function upsertGrade(cls, subj, cat, leistung, studentId, patch){
    mutate(()=>{
      const existing = state.grades.find(g=>g.classId===cls.id && g.studentId===studentId && g.categoryId===cat.id && g.leistungId===leistung.id);
      if(existing && patch.toggleKey!=null && existing[patch.toggleKey]===patch[patch.toggleKey]){
        state.grades = state.grades.filter(g=>g!==existing);
        return;
      }
      if(existing){
        Object.assign(existing, patch);
      } else {
        state.grades.push({id:uid("g"), classId:cls.id, subjectId:subj.id, categoryId:cat.id, studentId, date:leistung.date, leistungId:leistung.id, note:leistung.name, mult:1, ...patch});
      }
    });
  }

  function findSammelEntry(cls, cat, studentId, leistung){
    return state.grades.find(g=>g.classId===cls.id && g.studentId===studentId && g.categoryId===cat.id && g.leistungId===leistung.id);
  }
